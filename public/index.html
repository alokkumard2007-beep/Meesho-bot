  <span class="nav-blob" id="navBlob"></span>
  <button data-tab="search" class="active"><span class="ico">🔍</span>Search</button>
  <button data-tab="cart"><span class="ico icon-wrap">🛒<span class="tab-badge hidden" id="cartBadge">0</span></span>Cart</button>
  <button data-tab="orders"><span class="ico">📦</span>Orders</button>
  <button data-tab="address"><span class="ico">📍</span>Address</button>
  <button data-tab="refer"><span class="ico">🎁</span>Refer</button>
  <button data-tab="account"><span class="ico">🪪</span>Account</button>
</nav>

<script>
"use strict";
/* ================= Telegram setup ================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
try{ if(tg){ tg.ready(); tg.expand(); } }catch(e){}

/* single light theme — always */
function applyTheme(){
  document.documentElement.dataset.theme = 'light';
  try{
    if(tg && tg.setHeaderColor) tg.setHeaderColor('#FFFFFF');
    if(tg && tg.setBackgroundColor) tg.setBackgroundColor('#F2F4FA');
  }catch(e){}
}
applyTheme();
try{ if(tg && tg.onEvent) tg.onEvent('themeChanged', applyTheme); }catch(e){}

function haptic(type){
  try{
    const h = tg && tg.HapticFeedback;
    if(!h) return;
    if(type==='ok') h.notificationOccurred && h.notificationOccurred('success');
    else if(type==='err') h.notificationOccurred && h.notificationOccurred('error');
    else h.impactOccurred && h.impactOccurred(type||'light');
  }catch(e){}
}

/* ================= Auth + API ================= */
const AUTH = Object.fromEntries(new URLSearchParams(location.search));
function api(path, opts){
  const u = new URL(path, location.origin);
  u.search = new URLSearchParams({ ...AUTH, ...((opts && opts.q) || {}) });
  return fetch(u, {
    method: (opts && opts.method) || 'GET',
    headers: {
      'Content-Type': 'application/json',
      'X-Tg-Init-Data': ((window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || (new URLSearchParams(location.search).get('tgib')) || '')
    },
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined
  }).then(r => r.json());
}

/* ================= helpers ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rupee(n){
  if(n==null || isNaN(Number(n))) return '₹—';
  const v = Number(n);
  return '₹' + (Number.isInteger(v) ? v.toLocaleString('en-IN') : v.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}));
}
function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 260); }, 2400);
}
const PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340"><rect width="100%" height="100%" fill="#E6EAF4"/><text x="50%" y="50%" font-size="46" text-anchor="middle" dy=".35em">🛍️</text></svg>');
function imgTag(src, cls){
  return '<img loading="lazy" ' + (cls?('class="'+cls+'" '):'') + 'src="' + esc(src||PLACEHOLDER) + '" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'" alt="">';
}
function fmtDate(s){
  // "2026-08-20T14:04:36" → "Thu, 20 Aug"; pass through non-ISO strings
  const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return s;
  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  if(isNaN(d.getTime())) return s;
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+', '+d.getDate()+' '+mons[d.getMonth()];
}
function ratingClass(r){ return r>=4 ? '' : (r>=3 ? 'mid' : 'low'); }
function fmtCount(n){
  const v = Number(n);
  if(isNaN(v)) return '';
  if(v >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  return v.toLocaleString('en-IN');
}

/* ================= state ================= */
const S = {
  accounts: [], activeId: null, balance: 0,
  tab: 'search',
  searchQuery: '', searchOffset: 0, searchResults: [], searchLoading: false, searchDone: false, corrected: null,
  searchCursor: null, searchSession: null, sortMode: 'rel',
  searchMode: 'search', searchError: false, linkVal: '',
  orders: [], ordersMsg: 'No orders yet.', ordersLoaded: false, ordersError: false,
  orderFilters: [], orderStatus: 0, ordersCursor: null, ordersLoading: false, ordersDone: false,
  cart: null, cartLoaded: false, cartLoading: false, cartWarn: null, cartError: false,
  addresses: [], addrDefault: null, addrLoaded: false, addrLoading: false,
  detailStack: []
};
function recents(){ try{ return JSON.parse(localStorage.getItem('recent_searches')||'[]'); }catch(e){ return []; } }
function pushRecent(q){
  try{
    let r = recents().filter(x=>x.toLowerCase()!==q.toLowerCase());
    r.unshift(q); r = r.slice(0,8);
    localStorage.setItem('recent_searches', JSON.stringify(r));
  }catch(e){}
}

/* ================= bootstrap ================= */
function renderGate(kind){
  const g = document.createElement('div');
  g.className = 'gate'; g.id = 'appGate';
  const m = kind==='maintenance'
    ? '<div class="art">🛠</div><h3>Under maintenance</h3><p>The shop is temporarily closed for maintenance. Please check back shortly.</p>'
    : '<div class="art">🤖</div><h3>Open in Telegram</h3><p>Please open the shop from inside the Telegram bot.</p>';
  g.innerHTML = '<div class="inner">'+m+'</div>';
  document.body.appendChild(g);
}
async function bootstrap(){
  try{
    const d = await api('/api/bootstrap');
    if(d && d.error === 'open_in_telegram'){ renderGate(); return true; }
    if(d && d.maintenance){ renderGate('maintenance'); return true; }
    S.accounts = Array.isArray(d?.accounts) ? d.accounts : [];
    S.activeId = d?.active_id ?? null;
    S.balance = d?.balance ?? 0;
    S.fee = Number(d?.per_order_price ?? 0) || 0;
  }catch(e){
    S.accounts = []; S.activeId = null;
    toast('Could not reach server', 'err');
  }
  renderTopbar();
  if(S.tab==='account') renderAccount();
  if(!S.accounts.length){ renderNoAccount(); return; }
  refreshCartBadge();
  refreshOrderTicks();
}
function activeAccount(){
  return S.accounts.find(a=>a && a.id===S.activeId) || S.accounts[0] || null;
}
function fmtMobile(m){
  const s = String(m||'').replace(/\D/g,'');
  if(s.length===10) return s.slice(0,5)+' '+s.slice(5);
  return m || '—';
}
function renderTopbar(){
  const a = activeAccount();
  document.getElementById('acctNum').textContent = a ? fmtMobile(a.mobile) : 'No account';
  const od = document.getElementById('acctOrdered');
  if(od) od.classList.toggle('hidden', !(a && a.order_placed===true));
  document.getElementById('walletChip').textContent = '💰 ' + rupee(S.balance||0);
}
/* per-account order ticks: instant paint from bootstrap's cached order_placed,
   then one refresh via /api/accounts/order_status */
function orderedBadge(a){
  return (a && a.order_placed===true) ? '<span class="ordered-badge">✅ Ordered</span>' : '';
}
let orderStatusFetched = false;
async function refreshOrderTicks(){
  if(orderStatusFetched || !S.accounts.length) return;
  orderStatusFetched = true;
  try{
    const d = await api('/api/accounts/order_status');
    const st = d && d.statuses;
    if(st && typeof st === 'object'){
      S.accounts.forEach(a=>{
        if(!a) return;
        const v = (a.id in st) ? st[a.id] : st[String(a.id)];
        if(v !== undefined) a.order_placed = v;
      });
      renderTopbar();
      if(S.tab==='account') renderAccount();
    }
  }catch(e){ /* keep cached ticks */ }
}
function renderNoAccount(){
  const html = '<div class="empty"><div class="art">🔗</div><h3>No account linked</h3><p>Link your Meesho account in the bot chat to start shopping here.</p></div>';
  document.getElementById('tab-search').innerHTML = html;
  document.getElementById('tab-cart').innerHTML = html;
  document.getElementById('tab-orders').innerHTML = html;
  document.getElementById('tab-address').innerHTML = html;
  document.getElementById('tab-account').innerHTML = html;
}

/* ================= account switcher sheet ================= */
document.getElementById('acctPill').addEventListener('click', ()=>{
  haptic('light');
  if(!S.accounts.length){ toast('No account linked — add one in the bot'); return; }
  openSheet(
    '<h3>Switch account</h3>' +
    S.accounts.map(a=>{
      const on = a.id===S.activeId;
      return '<button class="sheet-acct" data-acct="'+esc(a.id)+'">' +
        '<div class="av">'+esc(String(a.mobile||'?').replace(/\D/g,'').slice(-2)||'?')+'</div>' +
        '<div><div class="m">'+esc(fmtMobile(a.mobile))+orderedBadge(a)+'</div>' +
        '<div class="s">'+esc(a.source==='otp'?'OTP login':(a.source||''))+' · ID '+esc(a.user_id??'—')+'</div></div>' +
        (on?'<span class="tick">✓</span>':'') + '</button>';
    }).join('')
  );
  document.querySelectorAll('[data-acct]').forEach(b=>b.addEventListener('click', ()=>selectAccount(b.dataset.acct)));
});
async function selectAccount(id){
  closeSheet(); haptic('med');
  const acct = S.accounts.find(a=>String(a.id)===String(id));
  if(acct && acct.id===S.activeId) return;
  try{
    const r = await api('/api/accounts/select', {method:'POST', body:{account_id: isNaN(Number(id)) ? id : Number(id)}});
    if(r?.error){ toast(r.error, 'err'); return; }
    toast('Switched account', 'ok'); haptic('ok');
    await bootstrap();
    // refresh current tab data
    S.cartLoaded = false; S.ordersLoaded = false; S.addrLoaded = false;
    refreshCartBadge();
    if(S.tab==='address'){ loadAddresses(); }
    if(S.tab==='search' && S.searchQuery){ doSearch(S.searchQuery, true); }
    if(S.tab==='cart'){ loadCart(); }
    if(S.tab==='orders'){ loadOrders(); }
    if(S.tab==='account'){ renderAccount(); }
  }catch(e){ toast('Switch failed — try again', 'err'); }
}

/* ================= sheets ================= */
function openSheet(inner){
  const host = document.getElementById('sheetHost');
  host.innerHTML = '<div class="sheet-overlay" onclick="closeSheet()"></div>' +
    '<div class="sheet"><div class="grab"></div>' + inner + '</div>';
}
function closeSheet(){ document.getElementById('sheetHost').innerHTML=''; }
window.closeSheet = closeSheet;
window.copyAwb = copyAwb;
window.openTracking = openTracking;

/* ================= tabs ================= */
document.getElementById('tabbar').addEventListener('click', e=>{
  const b = e.target.closest('button[data-tab]');
  if(!b) return;
  switchTab(b.dataset.tab);
});
function switchTab(tab){
  if(S.tab===tab) return;
  haptic('light');
  S.tab = tab;
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  moveNavBlob();
  ['search','cart','orders','address','account','refer'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==tab);
  });
  closeDetail(true);
  window.scrollTo(0,0);
  if(!S.accounts.length){ renderNoAccount(); return; }
  if(tab==='cart') loadCart(true);
  if(tab==='orders' && !S.ordersLoaded) loadOrders();
  if(tab==='address') loadAddresses();
  if(tab==='account') renderAccount();
  if(tab==='refer') loadRefer();
}
window.switchTab = switchTab;

/* springing blob under the active tab */
function moveNavBlob(){
  try{
    const blob = document.getElementById('navBlob');
    const bar = document.getElementById('tabbar');
    const act = bar && bar.querySelector('button.active');
    if(!blob || !act) return;
    const br = bar.getBoundingClientRect();
    const ar = act.getBoundingClientRect();
    blob.style.left = (ar.left - br.left) + 'px';
    blob.style.width = ar.width + 'px';
  }catch(e){}
}
window.addEventListener('resize', moveNavBlob);
setTimeout(moveNavBlob, 50);
setTimeout(moveNavBlob, 400);

/* ================= Telegram BackButton ================= */
function syncBackButton(){
  try{
    if(!tg || !tg.BackButton) return;
    if(S.detailStack.length) tg.BackButton.show(); else tg.BackButton.hide();
  }catch(e){}
}
try{ if(tg && tg.BackButton && tg.BackButton.onClick) tg.BackButton.onClick(()=>closeDetail()); }catch(e){}

/* ================= SEARCH TAB ================= */
function renderSearchShell(){
  const el = document.getElementById('tab-search');
  if(S.searchMode === 'link'){ renderLinkShell(); return; }
  el.innerHTML =
    segTabsHTML() +
    '<form class="search-row" id="searchForm">' +
      '<div class="search-box"><span class="mag">🔍</span>' +
      '<input id="searchInput" type="search" placeholder="Search for products…" enterkeyhint="search" value="'+esc(S.searchQuery)+'">' +
      '</div><button class="search-btn" type="submit">Go</button></form>' +
    '<div class="mood-row" id="moodRow">' +
      [['😍','Trending','trending'],['🔥','Deals','deals of the day'],['👗','New','new arrivals'],['🥻','Sarees','saree'],['👟','Shoes','shoes'],['🏠','Home','home decor']]
        .map(m=>'<button class="mood-chip" data-q="'+esc(m[2])+'">'+m[0]+' '+m[1]+'</button>').join('') + '</div>' +
    '<div id="recentWrap"></div>' +
    '<div id="correctedWrap"></div>' +
    '<div id="resultsWrap"></div>';
  document.getElementById('searchForm').addEventListener('submit', e=>{
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    if(q) doSearch(q, true);
  });
  document.getElementById('moodRow').querySelectorAll('.mood-chip').forEach(b=>b.addEventListener('click', ()=>{
    haptic('light');
    document.getElementById('searchInput').value = b.dataset.q;
    doSearch(b.dataset.q, true);
  }));
  bindSegTabs();
  renderRecents();
  renderResults();
}
function segTabsHTML(){
  return '<div class="seg-tabs" id="segTabs">' +
    '<button data-m="search" class="'+(S.searchMode==='search'?'on':'')+'">🔍 Search</button>' +
    '<button data-m="link" class="'+(S.searchMode==='link'?'on':'')+'">🔗 By Link</button></div>';
}
function bindSegTabs(){
  const st = document.getElementById('segTabs');
  if(!st) return;
  st.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
    if(S.searchMode === b.dataset.m) return;
    haptic('light');
    S.searchMode = b.dataset.m;
    renderSearchShell();
  }));
}
function renderLinkShell(){
  const el = document.getElementById('tab-search');
  el.innerHTML =
    segTabsHTML() +
    '<form class="link-row" id="linkForm">' +
      '<div class="search-box"><span class="mag">🔗</span>' +
      '<input id="linkInput" type="url" placeholder="Paste Meesho product link…" autocomplete="off" value="'+esc(S.linkVal)+'">' +
      '</div><button class="search-btn" type="submit" id="linkFetchBtn">Fetch</button></form>' +
    '<div class="empty" id="linkHint"><div class="art">🔗</div><h3>Open a product by link</h3><p>Paste a Meesho share link (meesho.com/s/p/…) and tap Fetch to view and order it.</p></div>';
  bindSegTabs();
  document.getElementById('linkForm').addEventListener('submit', e=>{
    e.preventDefault();
    fetchByLink();
  });
}
async function fetchByLink(){
  const inp = document.getElementById('linkInput');
  const link = (inp && inp.value || '').trim();
  S.linkVal = link;
  if(!link){ toast('Paste a product link first'); return; }
  haptic('med');
  const btn = document.getElementById('linkFetchBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try{
    const d = await api('/api/product/by_link', {method:'POST', body:{link}});
    if(d && !d.error && d.product_id != null){
      haptic('ok');
      openProduct({
        product_id: d.product_id, catalog_id: d.catalog_id,
        name: d.name, image: Array.isArray(d.images) ? d.images[0] : null, images: d.images,
        price: d.price, original_price: d.mrp, sizes: d.sizes,
        supplier_id: d.supplier_id, supplier_name: d.supplier_name,
        mall_verified: d.mall_verified, full_details: d.full_details, description: d.description
      });
    }else if(d?.error === 'bad_link'){
      haptic('err'); toast(d?.message || 'That link doesn’t look like a Meesho product link', 'err');
    }else{
      haptic('err'); toast(d?.message || d?.error || 'Could not fetch that product', 'err');
    }
  }catch(e){ haptic('err'); toast('Network error — try again', 'err'); }
  const btn2 = document.getElementById('linkFetchBtn');
  if(btn2){ btn2.disabled = false; btn2.textContent = 'Fetch'; }
}
function renderRecents(){
  const wrap = document.getElementById('recentWrap');
  if(!wrap) return;
  const r = recents();
  if(S.searchResults.length || S.searchLoading || !r.length){
    wrap.innerHTML = '';
    if(!S.searchResults.length && !S.searchLoading && !r.length){
      wrap.innerHTML = '<div class="empty"><div class="art">🛍️</div><h3>Discover great deals</h3><p>Search for anything — sarees, kurtis, watches, home decor and more.</p></div>';
    }
    return;
  }
  wrap.innerHTML = '<div class="recent-head"><span>Recent searches</span>'
    + '<button class="recent-clear" id="recentClear">🗑 Clear</button></div>'
    + '<div class="recent-wrap">' + r.map(q=>'<button class="recent-chip" data-q="'+esc(q)+'">🕘 '+esc(q)+'</button>').join('') + '</div>' +
    '<div class="empty" style="padding-top:28px"><div class="art">🛍️</div><h3>Discover great deals</h3><p>Search for anything — sarees, kurtis, watches, home decor and more.</p></div>';
  wrap.querySelectorAll('.recent-chip').forEach(b=>b.addEventListener('click', ()=>{
    document.getElementById('searchInput').value = b.dataset.q;
    doSearch(b.dataset.q, true);
  }));
  const cl = document.getElementById('recentClear');
  if(cl) cl.addEventListener('click', ()=>{
    haptic('med');
    try{ localStorage.removeItem('recent_searches'); }catch(e){}
    renderRecents();
  });
}
async function doSearch(query, reset){
  if(S.searchLoading) return;
  if(reset){
    haptic('light');
    S.searchQuery = query; S.searchOffset = 0; S.searchResults = []; S.searchDone = false; S.corrected = null;
    S.searchCursor = null; S.searchSession = null;
    pushRecent(query);
  }
  S.searchLoading = true;
  renderRecents(); renderResults();
  try{
    const body = {query: S.searchQuery, offset: S.searchOffset};
    if(S.searchCursor) body.cursor = S.searchCursor;
    if(S.searchSession) body.search_session_id = S.searchSession;
    const d = await api('/api/search', {method:'POST', body});
    if(d?.error){ toast(d.error, 'err'); S.searchError = true; }
    else S.searchError = false;
    const items = Array.isArray(d?.catalogs) ? d.catalogs : [];
    S.searchResults = S.searchResults.concat(items);
    S.corrected = d?.corrected_term || S.corrected;
    S.searchCursor = d?.cursor || null;
    S.searchSession = d?.search_session_id || S.searchSession;
    S.searchOffset += 20;
    if(!items.length || !S.searchCursor) S.searchDone = true;
  }catch(e){
    S.searchError = true;
    toast('Search failed — check connection', 'err');
  }
  S.searchLoading = false;
  renderRecents(); renderResults();
}
function parseDiscountNum(t){
  const m = String(t||'').replace(/[,₹]/g,'').match(/(\d+(?:\.\d+)?)/);
  return m ? Number(m[1]) : 0;
}
function sortedResults(){
  const list = S.searchResults.slice();
  const mode = S.sortMode;
  if(mode==='plh') list.sort((a,b)=>(Number(a?.price)||0)-(Number(b?.price)||0));
  else if(mode==='phl') list.sort((a,b)=>(Number(b?.price)||0)-(Number(a?.price)||0));
  else if(mode==='disc') list.sort((a,b)=>parseDiscountNum(b?.discount_text)-parseDiscountNum(a?.discount_text));
  else if(mode==='rate') list.sort((a,b)=>(Number(b?.rating)||0)-(Number(a?.rating)||0));
  return list;
}
let searchObserver = null;
function attachSearchSentinel(){
  const s = document.getElementById('searchSentinel');
  if(!s) return;
  if(searchObserver) searchObserver.disconnect();
  searchObserver = new IntersectionObserver(entries=>{
    if(entries.some(e=>e.isIntersecting) && !S.searchLoading && !S.searchDone && S.searchCursor){
      doSearch(S.searchQuery, false);
    }
  }, {rootMargin:'300px'});
  searchObserver.observe(s);
}
function skeletonCards(n){
  let h = '';
  for(let i=0;i<n;i++){
    h += '<div class="sk-card"><div class="sk sk-img"></div><div class="b">' +
      '<div class="sk sk-line" style="width:90%"></div><div class="sk sk-line" style="width:65%"></div>' +
      '<div class="sk sk-line" style="width:45%;height:14px"></div></div></div>';
  }
  return h;
}
function renderResults(){
  const wrap = document.getElementById('resultsWrap');
  const cw = document.getElementById('correctedWrap');
  if(!wrap) return;
  cw.innerHTML = (S.corrected && S.corrected.toLowerCase() !== (S.searchQuery||'').toLowerCase())
    ? '<div class="corrected">Showing results for <b>'+esc(S.corrected)+'</b></div>' : '';
  if(S.searchLoading && !S.searchResults.length){
    wrap.innerHTML = '<div class="grid">' + skeletonCards(6) + '</div>';
    return;
  }
  if(!S.searchResults.length){
    if(S.searchError && S.searchQuery && !S.searchLoading){
      wrap.innerHTML = '<div class="err-state"><div class="art">📡</div><h3>Search failed</h3><p>We couldn’t load results. Check your connection and try again.</p>' +
        '<button class="retry-btn" id="searchRetryBtn">Retry</button></div>';
      const rb = document.getElementById('searchRetryBtn');
      if(rb) rb.addEventListener('click', ()=>{ haptic('light'); doSearch(S.searchQuery, true); });
    }else if(S.searchQuery && !S.searchLoading){
      wrap.innerHTML = '<div class="empty"><div class="art">🔎</div><h3>No results</h3><p>Nothing found for “'+esc(S.searchQuery)+'”. Try a different search.</p></div>';
    } else wrap.innerHTML = '';
    return;
  }
  const SORTS = [['rel','Relevance'],['plh','Price ↑'],['phl','Price ↓'],['disc','Discount'],['rate','Rating']];
  let h = '<div class="filter-chips">' + SORTS.map(([k,l])=>
    '<button class="fchip'+(S.sortMode===k?' on':'')+'" data-sort="'+k+'">'+l+'</button>').join('') + '</div>';
  const shown = sortedResults();
  h += '<div class="grid">';
  shown.forEach((c,i)=>{
    const r = c?.rating;
    h += '<div class="pcard" data-idx="'+i+'" style="animation-delay:'+Math.min((i%20)*30,300)+'ms">' +
      '<div class="imgwrap">'+ imgTag(c?.image) + (c?.mall_verified ? '<span class="mall-badge">Mall</span>' : '') + '</div>' +
      '<div class="body"><div class="name">'+esc(c?.name||'Product')+'</div>' +

const P = { current:null, size:null, qty:1, varData:null, varLoading:false, adding:false, pdp:null, pdpLoading:false, pdpSeq:0 };
function mergedProduct(){
  const c = P.current || {};
  const p = P.pdp || {};
  const pick = (a,b)=> (a!=null && !(Array.isArray(a)&&!a.length) && a!=='') ? a : b;
  return {
    ...c,
    name: pick(p.name, c.name),
    brand: p.brand,
    price: pick(p.price, c.price),
    original_price: pick(p.mrp, c.original_price),
    image: pick(p.images && p.images[0], c.image),
    images: pick(p.images, c.images),
    sizes: pick(p.sizes, c.sizes),
    supplier_id: pick(p.supplier_id, c.supplier_id),
    supplier_name: pick(p.supplier_name, c.supplier_name),
    mall_verified: pick(p.mall_verified, c.mall_verified),
    full_details: pick(p.full_details, c.full_details),
    description: pick(p.description, c.description),
    highlights: Array.isArray(p.highlights) ? p.highlights : [],
    supplier_rating: p.supplier_rating,
    supplier_rating_count: p.supplier_rating_count,
    review_sentiment: Array.isArray(p.review_sentiment) ? p.review_sentiment : [],
    designs: Array.isArray(p.designs) ? p.designs : [],
    in_stock: p.in_stock,
    product_id: pick(p.product_id, c.product_id),
    catalog_id: pick(p.catalog_id, c.catalog_id)
  };
}
window.openOrderProduct = function(pid){
  if(pid == null) return;
  haptic('light');
  openProduct({product_id: pid, sizes: []});
};
function openProduct(c, replace){
  if(!c) return;
  haptic('light');
  P.current = c; P.qty = 1; P.varData = null; P.varLoading = false; P.adding = false;
  P.pdp = null; P.pdpLoading = true;
  P.size = (Array.isArray(c.sizes) && c.sizes.length) ? c.sizes[0] : null;
  if(!replace) S.detailStack.push('product');
  renderProductDetail();
  syncBackButton();
  if(P.size) fetchVariation();
  loadPdp(c.product_id);
}
async function loadPdp(productId){
  if(productId==null){ P.pdpLoading = false; return; }
  const seq = ++P.pdpSeq;
  try{
    const d = await api('/api/product', {q:{product_id: productId}});
    if(seq !== P.pdpSeq || !S.detailStack.length) return; // stale or closed
    P.pdpLoading = false;                    // fetch done → clear skeleton
    if(d && !d.error && d.product_id != null){
      P.pdp = d;
      // re-map selected size onto PDP sizes
      const sizes = Array.isArray(d.sizes) && d.sizes.length ? d.sizes : (Array.isArray(P.current?.sizes)?P.current.sizes:[]);
      let next = null;
      if(P.size) next = sizes.find(s=>s.variation_id===P.size.variation_id) || sizes.find(s=>s.name===P.size.name) || null;
      if(!next && sizes.length) next = sizes[0];
      const changed = (next?.variation_id) !== (P.size?.variation_id);
      P.size = next;
      renderProductDetail();                 // pdpLoading is false now → real UI
      const si = document.getElementById('shipInfo'); if(si) si.innerHTML = shipInfoHTML();
      if(changed && P.size) fetchVariation();
    }else{
      renderProductDetail();                 // error → clear skeleton, show whatever we have
    }
  }catch(e){
    if(seq === P.pdpSeq){ P.pdpLoading = false; renderProductDetail(); }
  }
}
function parseFullDetails(txt){
  const kv = []; const rest = [];
  String(txt||'').split('\n').forEach(line=>{
    const l = line.trim();
    if(!l) return;
    const m = l.match(/^([^:]{1,40}):\s*(.*)$/);
    if(m && m[2]) kv.push([m[1].trim(), m[2].trim()]);
    else if(m && !m[2]) kv.push([m[1].trim(), '']);
    else if(kv.length && kv[kv.length-1][1]==='') kv[kv.length-1][1] = l;
    else if(kv.length && /^[A-Za-z0-9]/.test(l) && l.length<80 && kv[kv.length-1][0].toLowerCase().includes('size')) kv[kv.length-1][1] += '\n' + l;
    else rest.push(l);
  });
  return {kv, rest};
}

async function fetchVariation(){
  if(!P.current) return;
  const c = mergedProduct();
  const vid = P.size?.variation_id;
  if(vid==null) return;
  P.varLoading = true; P.varData = null;
  const pb = document.getElementById('priceBlock'); if(pb) pb.innerHTML = priceBlockHTML();
  const si = document.getElementById('shipInfo'); if(si) si.innerHTML = '';
  try{
    const d = await api('/api/variation', {method:'POST', body:{product_id: c.product_id, supplier_id: c.supplier_id, variation_id: vid}});
    if(d?.error){ toast(d.error, 'err'); }
    else P.varData = d;
  }catch(e){ toast('Could not load size details', 'err'); }
  P.varLoading = false;
  const pb2 = document.getElementById('priceBlock'); if(pb2) pb2.innerHTML = priceBlockHTML();
  const si2 = document.getElementById('shipInfo'); if(si2) si2.innerHTML = shipInfoHTML();
  const btn = document.getElementById('addCartBtn');
  const bn = document.getElementById('buyNowBtn');
  const oos = P.varData && P.varData.in_stock===false;
  if(btn){ if(oos){ btn.disabled=true; btn.textContent='Out of Stock'; } else { btn.disabled=false; btn.innerHTML='Add to Cart 🛒'; } }
  if(bn){ if(oos){ bn.disabled=true; bn.textContent='Out of Stock'; } else { bn.disabled=false; bn.textContent='Buy Now'; } }
}
function errText(e, fb){
  if(typeof e==='string') return e;
  if(e && typeof e==='object') return e.message || e.error || e.msg || fb;
  return fb || 'Something went wrong';
}
async function addToCart(){
  if(!P.current || P.adding) return;
  const c = mergedProduct();
  // out of stock → don't hit the API (avoids a confusing error)
  if(c.in_stock===false || (P.varData && P.varData.in_stock===false)){
    haptic('err'); toast('This item is out of stock', 'err'); return;
  }
  haptic('med');
  const vid = P.size?.variation_id ?? (Array.isArray(c.sizes)&&c.sizes[0]?.variation_id) ?? 4;
  P.adding = true;
  const btn = document.getElementById('addCartBtn');
  const prev = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try{
    const d = await api('/api/cart/add', {method:'POST', body:{
      product_id: c.product_id, supplier_id: c.supplier_id,
      variation_id: vid, variation: P.size?.name || '', quantity: P.qty,
      price_type_id: P.varData?.price_type_id || undefined
    }});
    if(d?.success){
      haptic('ok');
      const total = d?.result?.effective_total;
      const qty = d?.result?.total_quantity;
      S.cartLoaded = false;
      if(qty!=null) setCartBadge(qty);
      refreshCartBadge();
      openSheet('<div class="cart-ok"><div class="big-check">🎉</div><h3>Yay! Added to cart</h3>' +
        '<p>'+esc(c.name||'Item')+(P.size?.name?' · Size '+esc(P.size.name):'')+' × '+P.qty+'</p>' +
        '<div class="sum">' +
        '<div class="cell"><b>'+rupee(total)+'</b><span>Cart total</span></div>' +
        '<div class="cell"><b>'+esc(qty??'—')+'</b><span>Items in cart</span></div>' +
        '</div><button class="done-btn" onclick="closeSheet()">Keep shopping ✨</button></div>');
      popConfetti();
    }else{
      haptic('err');
      toast(errText(d?.error || d?.message, 'Could not add to cart'), 'err');
    }
  }catch(e){ haptic('err'); toast('Network error — try again', 'err'); }
  P.adding = false;
  if(btn){ btn.disabled = false; btn.innerHTML = prev || 'Add to Cart 🛒'; }
}

/* celebratory confetti burst inside the cart-ok sheet */
function popConfetti(){
  try{
    const host = document.querySelector('.cart-ok');
    if(!host) return;
    const bits = ['✨','🎊','💖','⭐','🫧','💜'];
    for(let i=0;i<12;i++){
      const b = document.createElement('span');
      b.className = 'confetti-bit';
      b.textContent = bits[i % bits.length];
      const ang = (Math.PI*2*i)/12 + Math.random()*.5;
      b.style.setProperty('--cx', Math.round(Math.cos(ang)*(70+Math.random()*70))+'px');
      b.style.setProperty('--cy', Math.round(Math.sin(ang)*(50+Math.random()*60)-30)+'px');
      b.style.animationDelay = (Math.random()*.15)+'s';
      host.appendChild(b);
      setTimeout(()=>b.remove(), 1300);
    }
  }catch(e){}
}

function setCartBadge(n){
  const v = Number(n)||0;
  [document.getElementById('cartBadge'), document.getElementById('topCartBadge')].forEach(b=>{

function sanitizeBold(s){
  // allow only <b>/</b> from backend HTML snippets, escape everything else
  return esc(s).replace(/&lt;(\/?b)&gt;/gi, '<$1>');
}
async function cartMutate(path, body){
  const wrap = document.getElementById('cartItemsWrap');
  if(wrap) wrap.classList.add('cart-updating');
  try{
    const d = await api(path, {method:'POST', body});
    if(d?.error){ toast(d.error, 'err'); haptic('err'); }
    else if(d && (Array.isArray(d.items) || d.total_quantity!=null)){
      S.cart = d; S.cartLoaded = true;
      setCartBadge(d.total_quantity);
      const w = d?.warning;
      if(w && w.old_total!=null && w.new_total!=null && Number(w.old_total)!==Number(w.new_total)){
        S.cartWarn = w;
      }
      haptic('light');
    }else{
      // unknown shape — refetch
      await refreshCartBadge();
    }
  }catch(e){ toast('Update failed — try again', 'err'); haptic('err'); }
  renderCart();
  if(isCheckoutOpen()) renderCheckoutPage();
}

    item: {
      identifier: it?.identifier, product_id: it?.product_id, supplier_id: it?.supplier_id,
      variation_id: it?.variation_id, variation: it?.variation, quantity: qty,
      price_type_id: priceTypeId != null ? priceTypeId : it?.price_type_id
    }
  });
}

  try{ const p = JSON.parse(localStorage.getItem('pending_upi_payment')||'null');

/* ---- ONLINE (UPI) flow ---- */
const PAY_OK = ['SUCCESS','CHARGED','COMPLETED','PAID','TXN_SUCCESS'];
const PAY_FAIL = ['FAILED','EXPIRED','CANCELLED','DECLINED'];
function openUpiLink(){
  try{
    const url = CO.order && CO.order.redirect_url;
    if(!url) return;
    if(tg && tg.openLink) tg.openLink(url);
    else window.open(url, '_blank');
  }catch(e){}
}
async function startOnlinePay(){
  if(CO.placing) return;
  const addrId = S.cart?.address?.id;
  if(addrId==null){
    haptic('err'); toast('Select a delivery address first', 'err');
    openCartLocationSheet();
    return;
  }
  haptic('med');
  CO.placing = true;
  const btn = document.getElementById('coPlaceBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Starting payment…'; }
  try{
    const d = await api('/api/order/pay_online', {method:'POST', body:{address_id: addrId}});
    if(d?.ok && d.order_num != null){
      haptic('ok');
      CO.order = { order_num: d.order_num, juspay_order_id: d.juspay_order_id,
                   cart_session: d.cart_session, amount: d.amount, redirect_url: d.redirect_url,
                   upi_uri: d.upi_uri, ts: Date.now() };
      savePendingUpi(CO.order);
      CO.placing = false;
      renderPayWait('wait');
      if(d.redirect_url){ openUpiLink(); }
      else if(d.resume){ toast(errText(d.message, 'A payment is already in progress — checking status…')); }
      startPayPolling();
      return;
    }
    haptic('err');
    if(d?.error==='no_address'){
      toast(errText(d?.message, 'Please select a delivery address'), 'err');
      openCartLocationSheet();
    }else{
      toast(errText(d?.message || d?.error, 'Could not start payment'), 'err');
    }
  }catch(e){ haptic('err'); toast('Network error — try again', 'err'); }
  CO.placing = false;
  const btn2 = document.getElementById('coPlaceBtn');
  if(btn2){ btn2.disabled = false; btn2.textContent = 'Place Order'; }
}
function startPayPolling(){
  const seq = ++CO.pollSeq;
  CO.pollCount = 0;
  const tick = async ()=>{
    if(seq !== CO.pollSeq || !CO.order || !S.detailStack.length) return;
    let done = false;
    try{ done = await pollPaymentOnce(true); }catch(e){ done = false; }
    if(done || seq !== CO.pollSeq) return;
    CO.pollCount++;
    if(CO.pollCount >= 24){ renderPayWait('manual'); return; }
    setTimeout(tick, 4000);
  };
  setTimeout(tick, 4000);
}
async function pollPaymentOnce(silent){
  if(!CO.order) return true;
  try{
    const d = await api('/api/order/payment_status', {method:'POST', body:{order_num: CO.order.order_num, cart_session: CO.order.cart_session, juspay_order_id: CO.order.juspay_order_id}});
    const st = String(d?.status||'').toUpperCase();
    const ok = d?.state==='success' || PAY_OK.indexOf(st) >= 0;
    const fail = d?.state==='failed' || PAY_FAIL.indexOf(st) >= 0;
    if(ok){ await confirmOnlineOrder(); return true; }
    if(fail){ CO.pollSeq++; haptic('err'); clearPendingUpi(); renderPayWait('fail'); return true; }
    if(!silent) toast('Payment still pending — complete it in your UPI app');
  }catch(e){
    if(!silent) toast('Could not check payment status — try again', 'err');
  }
  return false;
}
async function confirmOnlineOrder(){
  CO.pollSeq++; // stop auto-polling
  const ord = CO.order;
  if(!ord) return;
  try{
    const d = await api('/api/order/confirm', {method:'POST', body:{order_num: ord.order_num, cart_session: ord.cart_session}});
    if(d?.ok){
      haptic('ok');
      clearPendingUpi();
      CO.order = null;
      S.cartLoaded = false; S.ordersLoaded = false; S.cartWarn = null;
      closeDetail(true);
      if(S.tab==='cart') loadCart(true); else refreshCartBadge();
      showOrderSuccess(ord.order_num, ord.amount, d?.message || 'Payment received — your order is confirmed!', 'Paid online');
      return;
    }
    haptic('err');
    toast(errText(d?.message || d?.error, 'Could not confirm order — tap "Check payment status"'), 'err');
    renderPayWait('manual');
  }catch(e){
    haptic('err');
    toast('Network error — tap "Check payment status"', 'err');
    renderPayWait('manual');
  }
}
function renderPayWait(state){
  if(!S.detailStack.length) return;
  const ord = CO.order || {};
  let inner;
  if(state==='fail'){
    inner = '<div class="pay-wait"><div class="fail-art">💔</div><h3>Payment failed</h3>' +
      '<div class="amt">'+rupee(ord.amount)+'</div>' +
      '<p>Your payment didn’t go through. If money was deducted, it will be refunded automatically.</p>' +
      '<button class="upi-btn" id="payRetryBtn">Try again</button>' +
      '<button class="upi-btn ghost" onclick="closeDetail()">Back to cart</button></div>';
  }else{
    const manual = state==='manual';
    const qr = ord.upi_uri
      ? '<div class="upi-qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='
        + encodeURIComponent(ord.upi_uri) + '" alt="UPI QR" width="200" height="200"'
        + ' onerror="this.parentNode.style.display=\'none\'">'
        + '<div class="qr-cap">Scan with any UPI app to pay</div></div>'
      : '';
    inner = '<div class="pay-wait">' +
      (manual
        ? '<div class="fail-art" style="background:var(--sun-bg)">⏳</div><h3>Still waiting…</h3>'
        : '<div class="big-spin"></div><h3>Waiting for payment…</h3>') +
      '<div class="amt">'+rupee(ord.amount)+'</div>' +
      '<p>'+(manual
        ? 'We haven’t seen your payment yet. If you’ve paid, tap “Check payment status” below.'
        : 'Complete the payment in your UPI app — we’ll confirm your order automatically.')+'</p>' +
      qr +
      '<button class="upi-btn ghost" id="upiOpenBtn">📲 Open UPI app again</button>' +
      '<button class="upi-btn" id="paidBtn">'+(manual ? 'Check payment status' : 'I’ve paid — check now')+'</button>' +
      '<button class="upi-btn danger" id="payClearBtn">🗑 Clear / Cancel payment</button></div>';
  }
  document.getElementById('detailHost').innerHTML =
    '<div class="detail"><div class="detail-top"><button class="back-btn" onclick="closeDetail()">←</button>' +
    '<div class="ttl">'+(state==='fail' ? 'Payment failed' : 'Pay Online (UPI)')+'</div></div>' + inner + '</div>';
  window.scrollTo(0,0);
  const ob = document.getElementById('upiOpenBtn');
  if(ob) ob.addEventListener('click', ()=>{ haptic('light'); openUpiLink(); });
  const pbn = document.getElementById('paidBtn');
  if(pbn) pbn.addEventListener('click', async ()=>{
    haptic('med');
    const prev = pbn.textContent;
    pbn.disabled = true; pbn.innerHTML = '<span class="spinner"></span>';
    let done = false;
    try{ done = await pollPaymentOnce(false); }catch(e){ done = false; }
    if(!done){
      const p2 = document.getElementById('paidBtn');
      if(p2){ p2.disabled = false; p2.textContent = prev; }
    }
  });
  const clr = document.getElementById('payClearBtn');
  if(clr) clr.addEventListener('click', ()=>{
    haptic('med');
    clearPendingUpi();
    CO.order = null; CO.pollSeq++; CO.prices = null;
    toast('Payment cleared', 'ok');
    closeDetail(true);
    if(S.tab==='cart') loadCart(true);
  });
  const rb = document.getElementById('payRetryBtn');
  if(rb) rb.addEventListener('click', ()=>{
    haptic('med');
    clearPendingUpi();
    CO.order = null; CO.pollSeq++;
    renderCheckoutPage();
    startOnlinePay();
  });
}

async function fetchAddresses(){

}
function isDefaultAddr(a){
  const d = S.addrDefault;
  if(!d || !a) return false;
  if(d.id!=null && a.id!=null) return String(d.id)===String(a.id);
  return d.name===a.name && String(d.pin||'')===String(a.pin||'');
}

    const d = await api('/api/addresses/random_update', {method:'POST', body:{address_id: a.id}});

      haptic('ok');
      const u = d.used || {};

      await fetchAddresses();
      renderAddresses();
      return;

    toast(d?.message || d?.error || 'Could not randomize', 'err'); haptic('err');
  }catch(e){ toast('Network error — try again', 'err'); haptic('err'); }

}

function initAddrMap(){
  try{
    if(!window.L || !document.getElementById('addrMap')){
      const mw = document.querySelector('.map-wrap'); if(mw) mw.style.display = 'none';
      const mh = document.querySelector('.map-hint'); if(mh) mh.style.display = 'none';
      return;
    }
    if(AF.map){ try{ AF.map.remove(); }catch(e){} AF.map = null; AF.marker = null; }
    const start = [22.9734, 78.6569]; // India
    const map = L.map('addrMap', {zoomControl:true, attributionControl:false}).setView(start, 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);
    const marker = L.marker(start, {draggable:true}).addTo(map);
    marker.on('dragend', ()=>{
      const p = marker.getLatLng();
      reverseGeo(p.lat, p.lng);
    });
    map.on('click', e=>{
      marker.setLatLng(e.latlng);
      reverseGeo(e.latlng.lat, e.latlng.lng);
    });
    AF.map = map; AF.marker = marker;
    setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 250);
  }catch(e){
    const mw = document.querySelector('.map-wrap'); if(mw) mw.style.display = 'none';
  }
}
function setMapPos(lat, lng, zoom){
  try{
    if(!AF.map || !AF.marker || lat==null || lng==null) return;
    AF.marker.setLatLng([lat, lng]);
    AF.map.setView([lat, lng], zoom || Math.max(AF.map.getZoom(), 15));
  }catch(e){}
}
async function reverseGeo(lat, lng, accuracy){
  AF.coords = { latitude:String(lat), longitude:String(lng), accuracy:String(accuracy||'20') };
  const cp = document.getElementById('coordPill');
  if(cp) cp.innerHTML = '<span class="coord-pill">✓ Location pinned</span>';
  try{
    const d = await api('/api/geocode', {q:{lat, lng}});
    const r = (Array.isArray(d?.results) && d.results[0]) || null;
    if(r) applyGeoResult({...r, lat, lng}, accuracy||'20', true);
  }catch(e){ /* keep pin */ }
}
async function useMyAddress(){

  const btn = document.getElementById('useMyAddrBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Loading…'; }

function hideGeoResults(){ const r = document.getElementById('geoResults'); if(r){ r.classList.add('hidden'); r.innerHTML=''; } }
async function geoSearch(q){
  const seq = ++AF.geoSeq;
  try{
    const d = await api('/api/geocode', {q:{q}});
    if(seq !== AF.geoSeq) return;
    const res = Array.isArray(d?.results) ? d.results : [];
    const wrap = document.getElementById('geoResults');
    if(!wrap) return;
    if(!res.length){ hideGeoResults(); return; }
    wrap.innerHTML = res.slice(0,6).map((r,i)=>'<button type="button" class="geo-item" data-gi="'+i+'"><span class="gi">📍</span>' +
      '<span>'+esc(r?.formatted||'')+'<span class="gs">'+esc([r?.city,r?.state,r?.pin].filter(Boolean).join(', '))+'</span></span></button>').join('');
    wrap.classList.remove('hidden');
    wrap.querySelectorAll('[data-gi]').forEach(b=>b.addEventListener('click', ()=>applyGeoResult(res[Number(b.dataset.gi)], '20')));
  }catch(e){ /* silent */ }
}
function applyGeoResult(r, accuracy, noMap){
  if(!r) return;
  haptic('light');
  hideGeoResults();
  const set = (id,v)=>{ const el = document.getElementById(id); if(el && v) el.value = v; };
  set('afPin', r.pin); set('afCity', r.city); set('afState', r.state); set('afL2', r.area);
  const gi = document.getElementById('geoInput'); if(gi && r.formatted) gi.value = r.formatted;
  if(r.lat!=null && r.lng!=null){
    AF.coords = { latitude:String(r.lat), longitude:String(r.lng), accuracy:String(accuracy||'20') };
    const cp = document.getElementById('coordPill');
    if(cp) cp.innerHTML = '<span class="coord-pill">✓ Location pinned</span>';
    if(!noMap) setMapPos(Number(r.lat), Number(r.lng), 16);
  }
}
function useCurrentLocation(){
  haptic('light');
  if(!navigator.geolocation){ toast('Location not available on this device', 'err'); return; }
  const btn = document.getElementById('useLocBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Locating…'; }
  const reset = ()=>{ if(btn){ btn.disabled = false; btn.textContent = '📍 Use current location'; } };
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const {latitude, longitude, accuracy} = pos.coords || {};
      setMapPos(latitude, longitude, 16);
      const d = await api('/api/geocode', {q:{lat: latitude, lng: longitude}});
      const r = (Array.isArray(d?.results) && d.results[0]) || null;
      if(r){
        applyGeoResult({...r, lat: r.lat ?? latitude, lng: r.lng ?? longitude}, Math.round(accuracy||20));
        toast('Location detected ✓', 'ok'); haptic('ok');
      }else{
        AF.coords = { latitude:String(latitude), longitude:String(longitude), accuracy:String(Math.round(accuracy||20)) };
        const cp = document.getElementById('coordPill');
        if(cp) cp.innerHTML = '<span class="coord-pill">✓ Location pinned</span>';
        toast('Location pinned — fill address manually');
      }
    }catch(e){ toast('Could not resolve location', 'err'); }
    reset();
  }, err=>{
    toast('Location permission denied', 'err');
    reset();
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}
async function saveAddress(){
  const val = id => (document.getElementById(id)?.value || '').trim();
  const mark = (id,bad)=>{ const el = document.getElementById(id); if(el) el.classList.toggle('err', !!bad); };
  const name = val('afName'), mobile = val('afMobile'), pin = val('afPin'),
        city = val('afCity'), state = val('afState'),
        l1 = val('afL1'), l2 = val('afL2'), landmark = val('afLandmark');
  let bad = false;
  mark('afName', !name); bad = bad || !name;
  mark('afMobile', !/^\d{10}$/.test(mobile)); bad = bad || !/^\d{10}$/.test(mobile);
  mark('afPin', !/^\d{6}$/.test(pin)); bad = bad || !/^\d{6}$/.test(pin);
  mark('afL1', !l1); bad = bad || !l1;
  if(bad){ haptic('err'); toast('Please fill the highlighted fields', 'err'); return; }
  haptic('med');
  const btn = document.getElementById('saveAddrBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  const editing = !!AF.editId;
  try{
    const body = {
      name, mobile, pin, city, state,
      address_line_1: l1, address_line_2: l2, landmark,
      address_type: AF.type,
      coordinates: AF.coords || {latitude:'0', longitude:'0', accuracy:'0'}
    };
    if(editing) body.address_id = AF.editId;
    const d = await api(editing ? '/api/addresses/update' : '/api/addresses/create',
                        {method:'POST', body});
    if(d?.ok){
      haptic('ok');
      toast(editing ? 'Address updated ✓' : 'Address added ✓', 'ok');
      closeDetail(true);
      S.addrLoaded = false;
      if(S.tab==='address') loadAddresses(true); else fetchAddresses();
      return;
    }
    toast(d?.message || d?.error || 'Could not save address', 'err'); haptic('err');
  }catch(e){ toast('Network error — try again', 'err'); haptic('err'); }
  if(btn){ btn.disabled = false; btn.textContent = editing ? 'Update Address' : 'Save Address'; }
}

/* ================= ORDERS TAB ================= */
function statusClass(o){
  const id = String(o?.status_id||'').toUpperCase();
  if(id.includes('DELIVERED')) return 'st-green';
  if(id.includes('CANCEL') || id.includes('RETURN') || id.includes('RTO')) return 'st-red';
  if(id.includes('OUT_FOR_DELIVERY') || id.includes('SHIPPED') || id.includes('TRANSIT') || id.includes('DISPATCH')) return 'st-blue';
  if(id) return 'st-amber';
  return 'st-grey';
}
function hexTint(hex, alpha){
  const m = String(hex||'').match(/^#?([0-9a-f]{6})$/i);
  if(!m) return null;
  const n = parseInt(m[1],16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+alpha+')';
}
function statusPillHTML(o, extraStyle){
  const cls = statusClass(o);
  let style = extraStyle||'';
  // if backend supplies a hex color and we have no strong mapping, tint from it
  if(cls==='st-grey' || cls==='st-amber'){
    const tint = hexTint(o?.status_color, 0.14);
    const txt = hexTint(o?.status_color, 1);
    if(tint && txt) style += ';background:'+tint+';color:'+txt;
  }
  return '<span class="status-pill '+cls+'" style="'+style+'">'+esc(o?.status_text||'—')+'</span>';
}
function shipmentLine(o){
  // shipment_details only exists once Meesho hands the parcel to a carrier
  if(!o || !o.awb) return '';
  const name = o.carrier_name || o.carrier || 'Courier';
  const awb = String(o.awb);
  const track = o.tracking_url
    ? '<button class="ship-track" data-track="'+esc(o.tracking_url)+'">Track ›</button>' : '';
  return '<div class="ship-line"><span class="ship-c">📦 '+esc(name)+'</span>' +
    '<button class="ship-awb" data-awb="'+esc(awb)+'">'+esc(awb)+' <span>⧉</span></button>' +
    track + '</div>';
}
function copyAwb(awb){
  const done = ()=>{ haptic('ok'); toast('AWB copied ✅','ok'); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(awb).then(done, ()=>fallbackCopy(awb,done));
    }else{ fallbackCopy(awb, done); }
  }catch(_){ fallbackCopy(awb, done); }
}
function openTracking(url){
  haptic('light');
  try{ if(window.tg && tg.openLink) { tg.openLink(url); return; } }catch(e){}
  window.open(url, '_blank');
}

function orderDeliveryLine(o){
  const id = String(o?.status_id||'').toUpperCase();
  if(id.includes('DELIVERED')) return '✅ Delivered • '+esc(fmtDate(o?.updated_date || o?.delivery_date || ""));
  if(id.includes('CANCEL')) return '✖️ Cancelled'+(o?.updated_date?' • '+esc(fmtDate(o.updated_date)):'');
  if(o?.delivery_date) return '🚚 Delivery by '+esc(fmtDate(o.delivery_date));
  return '';
}
async function loadOrders(reset){
  if(S.ordersLoading) return;
  if(reset!==false) reset = true;
  const el = document.getElementById('tab-orders');
  if(reset){
    S.orders = []; S.ordersCursor = null; S.ordersDone = false;
    el.innerHTML = '<div class="page-title">My Orders</div><div class="center-load"><div class="spinner"></div></div>';
  }
  S.ordersLoading = true;
  try{
    const q = {status: S.orderStatus};
    if(S.ordersCursor) q.cursor = S.ordersCursor;
    const d = await api('/api/orders', {q});
    if(d?.error){
      toast(d.error, 'err');
      S.ordersError = true;
      S.ordersDone = true;
    }else{
      S.ordersError = false;
      const items = Array.isArray(d?.orders) ? d.orders : [];
      S.orders = S.orders.concat(items);
      if(Array.isArray(d?.filters) && d.filters.length) S.orderFilters = d.filters;
      S.ordersCursor = d?.cursor || null;
      if(!items.length || !S.ordersCursor) S.ordersDone = true;
      S.ordersMsg = d?.message || 'When you place orders, they will show up here.';
      S.ordersLoaded = true;
    }
  }catch(e){
    S.ordersError = true;
    S.ordersMsg = 'Could not load orders.';
    toast('Failed to load orders', 'err');
    S.ordersDone = true;
  }
  S.ordersLoading = false;
  renderOrders();
}
let ordersObserver = null;
function attachOrdersSentinel(){
  const s = document.getElementById('ordersSentinel');
  if(!s) return;
  if(ordersObserver) ordersObserver.disconnect();
  ordersObserver = new IntersectionObserver(entries=>{
    if(entries.some(e=>e.isIntersecting) && !S.ordersLoading && !S.ordersDone && S.ordersCursor){
      loadOrders(false);
    }
  }, {rootMargin:'300px'});
  ordersObserver.observe(s);
}
function renderOrders(){
  const el = document.getElementById('tab-orders');
  if(S.tab!=='orders') return;
  const filters = S.orderFilters.length ? S.orderFilters : [{id:0,name:'All'}];
  let h = '<div class="page-title">My Orders</div>' +
    '<div class="filter-chips">' + filters.map(f=>
      '<button class="fchip'+(Number(S.orderStatus)===Number(f?.id)?' on':'')+'" data-f="'+esc(f?.id)+'">'+esc(f?.name||'')+'</button>').join('') + '</div>';
  const list = S.orders;
  if(!list.length && S.ordersError){
    h += '<div class="err-state"><div class="art">📡</div><h3>Couldn’t load orders</h3><p>Something went wrong while fetching your orders.</p>' +
      '<button class="retry-btn" id="ordersRetryBtn">Retry</button></div>';
    el.innerHTML = h;
    el.querySelectorAll('.fchip').forEach(b=>b.addEventListener('click', ()=>{
      haptic('light');
      S.orderStatus = Number(b.dataset.f)||0;
      loadOrders(true);
    }));
    const orb = document.getElementById('ordersRetryBtn');
    if(orb) orb.addEventListener('click', ()=>{ haptic('light'); loadOrders(true); });
    return;
  }
  if(!list.length){
    const fname = (filters.find(f=>Number(f?.id)===Number(S.orderStatus))?.name)||'';
    h += '<div class="empty"><div class="art">📦</div><h3>No orders here</h3><p>' +
      (Number(S.orderStatus)===0 ? esc(S.ordersMsg) : 'No '+esc(fname.toLowerCase())+' orders found.') + '</p>' +
      '<button class="cta" onclick="switchTab(\'search\')">Start shopping</button></div>';
  }else{
    list.forEach((o,i)=>{
      const dline = orderDeliveryLine(o);
      h += '<div class="ocard" data-oi="'+i+'">' +
        '<div class="head"><span class="oid">#'+esc(o?.sub_order_num || o?.order_num || o?.order_id || '—')+'</span>' +
        statusPillHTML(o) + '</div>' +
        (dline?'<div class="deliv-line">'+dline+'</div>':'') +
        shipmentLine(o) +
        '<div class="items"><div class="thumbs">' + imgTag(o?.image) + '</div>' +
        '<div class="isum"><div class="n">'+(o?.size?'Size: '+esc(o.size):'Order item')+'</div>' +
        '<div class="s">Qty '+esc(o?.quantity??1)+'</div></div></div>' +
        '<div class="foot"><span>'+(o?.updated_date?'Updated '+esc(fmtDate(o.updated_date)):'')+'</span>' +
        '<span style="color:var(--brand);font-weight:700;font-size:12.5px">View details ›</span></div></div>';
    });
  }
  if(list.length){
    if(S.ordersLoading) h += '<div class="sentinel-row"><div class="spinner"></div></div>';
    else if(!S.ordersDone) h += '<div class="sentinel-row" id="ordersSentinel"><div class="spinner" style="visibility:hidden"></div></div>';
    else h += '<div class="end-note">— No more orders —</div>';
  }
  el.innerHTML = h;
  el.querySelectorAll('.fchip').forEach(b=>b.addEventListener('click', ()=>{
    haptic('light');
    S.orderStatus = Number(b.dataset.f)||0;
    loadOrders(true);
  }));
  el.querySelectorAll('.ocard').forEach(c=>c.addEventListener('click', ()=>{
    const o = S.orders[Number(c.dataset.oi)];
    if(o) openOrderDetail(o);
  }));
  // AWB copy / Track must not also open the order detail behind them
  el.querySelectorAll('[data-awb]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation(); copyAwb(b.dataset.awb);
  }));
  el.querySelectorAll('[data-track]').forEach(b=>b.addEventListener('click', e=>{
    e.stopPropagation(); openTracking(b.dataset.track);
  }));
  attachOrdersSentinel();
}

function timelineProgress(statusId){

/* ---- cancel order flow ---- */
const CX = { reasons:[], selected:null, cancelling:false };
async function openCancelSheet(orderNum, subOrderNum){
  haptic('med');
  CX.selected = null; CX.cancelling = false;
  openSheet('<h3>Cancel order</h3><div class="center-load"><div class="spinner"></div></div>');
  let reasons = [];
  try{
    const d = await api('/api/orders/cancel_reasons', {q:{order_num:orderNum, sub_order_num:subOrderNum}});
    if(d?.error){ toast(d.error, 'err'); closeSheet(); return; }
    reasons = Array.isArray(d?.reasons) ? d.reasons : [];
  }catch(e){ toast('Could not load cancel reasons', 'err'); closeSheet(); return; }
  if(!document.querySelector('.sheet')) return; // user closed while loading
  if(!reasons.length){ toast('This order cannot be cancelled right now', 'err'); closeSheet(); return; }
  CX.reasons = reasons;
  openSheet('<h3>Why do you want to cancel?</h3>' +
    reasons.map((r,i)=>'<button class="reason-row" data-cr="'+i+'"><span class="radio"></span>' +
      '<span class="rt">'+esc(r?.description||'')+'</span></button>').join('') +
    '<div id="cancelCommentWrap"></div>' +
    '<button class="sheet-cta danger" id="cancelConfirmBtn" disabled>Confirm Cancellation</button>');
  const confirmBtn = document.getElementById('cancelConfirmBtn');
  document.querySelectorAll('[data-cr]').forEach(b=>b.addEventListener('click', ()=>{
    haptic('light');
    CX.selected = reasons[Number(b.dataset.cr)];
    document.querySelectorAll('.reason-row').forEach(x=>x.classList.toggle('on', x===b));
    const cw = document.getElementById('cancelCommentWrap');
    if(cw){
      cw.innerHTML = CX.selected?.comment_required
        ? '<textarea class="cancel-ta" id="cancelComment" placeholder="Please tell us more (required)…"></textarea>'
        : '<textarea class="cancel-ta" id="cancelComment" placeholder="Add a comment (optional)…"></textarea>';
    }
    if(confirmBtn) confirmBtn.disabled = false;
  }));
  if(confirmBtn) confirmBtn.addEventListener('click', ()=>confirmCancel(orderNum, subOrderNum));
}
async function confirmCancel(orderNum, subOrderNum){
  if(!CX.selected || CX.cancelling) return;
  const ta = document.getElementById('cancelComment');
  const comments = (ta && ta.value || '').trim();
  if(CX.selected.comment_required && !comments){
    if(ta) ta.classList.add('err');
    haptic('err'); toast('Please add a comment first', 'err');
    return;
  }
  haptic('med');
  CX.cancelling = true;
  const btn = document.getElementById('cancelConfirmBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try{
    const d = await api('/api/orders/cancel', {method:'POST', body:{
      order_num: orderNum, sub_order_num: subOrderNum,
      reason_id: CX.selected.id, comments
    }});
    if(d?.ok){
      haptic('ok');
      toast('Order cancelled', 'ok');
      closeSheet();
      // refresh detail (no longer cancellable) + orders list
      if(OD.o) openOrderDetail(OD.o, true);
      S.ordersLoaded = false;
      loadOrders(true);
      return;
    }
    haptic('err');
    toast(d?.message || d?.error || 'Could not cancel order', 'err');
  }catch(e){ haptic('err'); toast('Network error — try again', 'err'); }
  CX.cancelling = false;
  const btn2 = document.getElementById('cancelConfirmBtn');
  if(btn2){ btn2.disabled = false; btn2.textContent = 'Confirm Cancellation'; }
}

    t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t);
    t.select(); document.execCommand('copy'); document.body.removeChild(t); cb&&cb();
  }catch(_){ toast('Copy failed — long-press the link','err'); }
}

/* ---- session expiry (xo `exp`, ~48h lifetime) ---- */
function fmtExpiry(ts){
  try{
    const d = new Date(ts*1000);
    return d.toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit',
      minute:'2-digit', hour12:true, timeZone:'Asia/Kolkata'});
  }catch(e){ return ''; }
}
function humanLeft(sec){
  if(sec <= 0) return 'expired';
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  if(h >= 24){ const d = Math.floor(h/24); return d+'d '+(h%24)+'h left'; }
  if(h >= 1) return h+'h '+m+'m left';
  return m+'m left';
}
function sessionBoxHtml(a){
  const exp = a && a.xo_exp;
  if(!exp) return '';
  const now = Math.floor(Date.now()/1000);
  const left = exp - now;
  const cls = left <= 0 ? 'dead' : (left < 6*3600 ? 'warn' : 'ok');
  const icon = left <= 0 ? '⛔' : (left < 6*3600 ? '⚠️' : '🔐');
  let head;
  if(left <= 0) head = 'Session expired';
  else if(left < 6*3600) head = 'Session expiring soon';
  else head = 'Session active';
  let hint = '';
  if(left <= 0) hint = 'Tap Refresh Session below to get a new token.';
  else if(left < 6*3600) hint = 'Refresh it now — tap 🔄 Refresh Session below.';
  return '<div class="sess-box '+cls+'">' +
    '<div class="sb-top">'+icon+' '+head+'<span class="sb-left">'+esc(humanLeft(left))+'</span></div>' +
    '<div class="sb-sub">Expires: '+esc(fmtExpiry(exp))+' IST</div>' +
    (hint ? '<div class="sb-hint">'+hint+'</div>' : '') + '</div>';
}

  const o = FOD.data;
  if(!o){
    return '<div class="fod-card empty"><div class="fod-l">🎉 Your 1st order discount</div>'
      + '<div class="fod-sub">'+esc(FOD.msg || 'No offer available for this account right now.')+'</div>'
      + '<button class="fod-btn" onclick="loadFod(true)">🔄 Check again</button></div>';
  }
  return '<div class="fod-card"><div class="fod-l">🎉 Your 1st order discount</div>'
    + '<div class="fod-v">'+esc([o.title, o.text].filter(Boolean).join(' '))+'</div>'
    + '<div class="fod-sub">'+esc(o.subtitle||'on 1st order')
    + (o.duration ? ' · valid '+esc(o.duration)+' day'+(Number(o.duration)>1?'s':'') : '')
    + (o.bucket ? ' · bucket '+esc(o.bucket) : '') + '</div>'
    + '<button class="fod-btn" onclick="loadFod(true)">🔄 Refresh offer</button></div>';
}
async function loadFod(force){
  const a = activeAccount();
  if(!a) return;
  if(FOD.loading) return;
  if(!force && FOD.data && FOD.acctId===a.id) return;
  FOD.loading = true; FOD.acctId = a.id;
  if(force) haptic('light');
  paintFod();
  try{
    const d = await api('/api/account/fod');
    FOD.data = (d && d.offer) || null;
    FOD.msg = (d && d.message) || '';
  }catch(e){ FOD.data = null; FOD.msg = 'Could not load the offer — try again.'; }
  FOD.loading = false;
  paintFod();
}
function paintFod(){
  const el = document.getElementById('fodCard');
  if(el) el.innerHTML = fodCardHtml();
}
window.loadFod = loadFod;

async function refreshSession(acctId){
  const btn = document.getElementById('refreshSessionBtn');
  if(btn && btn.disabled) return;
  haptic('med');
  let saved = '';
  if(btn){
    saved = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<div class="lic"><span class="mini-spin"></span></div>'
      + '<div class="lbl">Refreshing…<span class="sub">Getting a new token from Meesho</span></div>';
  }
  try{
    const d = await api('/api/accounts/refresh', {method:'POST', body:{account_id: acctId}});
    if(d && d.ok){
      haptic('ok');
      toast('🔄 Session refreshed — new token saved', 'ok');
      await bootstrap();
    }else{
      haptic('err');
      toast((d && (d.message || d.error)) || 'Refresh failed — try again', 'err');
    }
  }catch(e){
    haptic('err');
    toast('Network error — try again', 'err');
  }
  if(btn){ btn.disabled = false; btn.innerHTML = saved; }
  if(S.tab==='account') renderAccount();
}
async function exportSession(){
  const btn = document.getElementById('exportSessionBtn');
  if(btn && btn.disabled) return;           // guard against double-taps
  haptic('med');
  let saved = '';
  if(btn){
    saved = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<div class="lic"><span class="mini-spin"></span></div>'
      + '<div class="lbl">Sending file…<span class="sub">Preparing your session file</span></div>';
  }
  try{
    const d = await api('/api/account/export_file', {method:'POST'});
    if(d && d.ok){
      haptic('ok');
      toast('📁 Session file sent to your chat', 'ok');
    }else{
      haptic('err');
      toast((d && (d.message || d.error)) || 'Export failed — try again', 'err');
    }
  }catch(e){
    haptic('err');
    toast('Network error — try again', 'err');
  }
  if(btn){ btn.disabled = false; if(saved) btn.innerHTML = saved; }
}
window.exportSession = exportSession;

/* ================= MANAGE ACCOUNTS (?view=manage) ================= */
const MA = { list:[], sel:{}, busy:false, results:null, loading:false };
function maExpiryHtml(a){
  const exp = a && a.xo_exp;
  if(!exp) return '<span class="ml-exp dead">⛔ no session</span>';
  const left = exp - Math.floor(Date.now()/1000);
  if(left <= 0) return '<span class="ml-exp dead">⛔ expired</span>';
  const cls = left < 6*3600 ? 'warn' : 'ok';
  const ic = left < 6*3600 ? '⚠️' : '🔐';
  return '<span class="ml-exp '+cls+'">'+ic+' '+esc(humanLeft(left))+'</span>';
}
function maIsExpired(a){
  const exp = a && a.xo_exp;
  return !exp || (exp - Math.floor(Date.now()/1000)) <= 0;
}
function maSelectedIds(){
  return MA.list.filter(a=>MA.sel[a.id]).map(a=>a.id);
}
function maRowsHtml(sel, prefix){
  if(!MA.list.length) return '<div class="empty"><div class="art">👥</div><h3>No accounts</h3><p>Add an account from the bot chat first.</p></div>';
  return MA.list.map(a=>
    '<button class="ml-row'+(sel[a.id]?' on':'')+'" data-'+prefix+'="'+esc(a.id)+'">' +
    '<span class="ml-box">'+(sel[a.id]?'✓':'')+'</span>' +
    '<span class="ml-mid"><span class="ml-mob">+91 '+esc(fmtMobile(a.mobile))+'</span>' +
    '<span class="ml-sub"><span class="ml-tag">'+esc(sourceLabel(a.source))+'</span>'+maExpiryHtml(a)+'</span></span>' +
    '</button>'
  ).join('');
}
async function maFetch(){
  MA.loading = true;
  try{
    const d = await api('/api/accounts/list');
    MA.list = (d && Array.isArray(d.accounts)) ? d.accounts : [];
    const keep = {};
    MA.list.forEach(a=>{ if(MA.sel[a.id]) keep[a.id] = true; });
    MA.sel = keep;
  }catch(e){ MA.list = []; }
  MA.loading = false;
}
async function openManageAccounts(){
  haptic('light');
  MA.sel = {}; MA.results = null; MA.busy = false;
  S.detailStack.push('manage'); syncBackButton();
  const host = document.getElementById('detailHost');
  host.innerHTML = '<div class="detail"><div class="detail-top"><button class="back-btn" onclick="closeDetail()">←</button>'
    + '<div class="ttl">Manage Accounts</div></div><div class="ml-pad" id="maBody">'
    + '<div class="center-load"><div class="spinner"></div></div></div></div>';
  await maFetch();
  renderManage();
}
window.openManageAccounts = openManageAccounts;
function renderManage(){
  const b = document.getElementById('maBody');
  if(!b) return;
  const total = MA.list.length;
  const sel = maSelectedIds().length;
  const dead = MA.list.filter(maIsExpired).length;
  let h = '<div class="ml-head"><div class="mh-stats">' +
    '<span class="ml-pill">👥 '+total+' account'+(total===1?'':'s')+'</span>' +
    '<span class="ml-pill sel">✓ '+sel+' selected</span>' +
    '<span class="ml-pill'+(dead?' bad':'')+'">⛔ '+dead+' expired</span>' +
    '</div><div class="mh-acts">' +
    '<button onclick="maSelectAll()">Select all</button>' +
    '<button onclick="maClearAll()">Clear</button>' +
    '</div></div>';
  if(MA.results) h += maResultsHtml();
  h += maRowsHtml(MA.sel, 'maid');
  const d = MA.busy ? ' disabled' : '';
  const sp = '<span class="mini-spin"></span>';
  h += '<div class="ml-bar">' +
    '<button'+d+' onclick="maRefreshBulk()">'+(MA.busy==='refresh'?sp:'🔄')+' Refresh</button>' +
    '<button'+d+' onclick="maExportBulk()">'+(MA.busy==='export'?sp:'📤')+' Export</button>' +
    '<button class="danger"'+d+' onclick="maConfirmDelete()">'+(MA.busy==='delete'?sp:'🗑')+' Delete</button>' +
    '</div>';
  b.innerHTML = h;
  b.querySelectorAll('[data-maid]').forEach(r=>r.addEventListener('click', ()=>maToggle(r.dataset.maid)));
}
function maResultsHtml(){
  const r = MA.results || {};
  const rows = Array.isArray(r.rows) ? r.rows : [];
  return '<div class="ml-res"><h4>'+esc(r.title||'Result')+'</h4>' +
    rows.map(x=>'<div class="rr'+(x.ok?'':' bad')+'"><span>'+(x.ok?'✅':'❌')+'</span>' +
      '<span><b>+91 '+esc(fmtMobile(x.mobile))+'</b>' +
      (x.ok ? (x.xo_exp ? ' — now valid <b>'
                          + esc(humanLeft(x.xo_exp - Math.floor(Date.now()/1000))) + '</b>' : '')
            : ' — '+esc(x.error||'failed')) + '</span></div>').join('') +
    '</div>';
}
function maToggle(id){
  const a = MA.list.find(x=>String(x.id)===String(id));
  if(!a) return;
  haptic('light');
  if(MA.sel[a.id]) delete MA.sel[a.id]; else MA.sel[a.id] = true;
  renderManage();
}
function maSelectAll(){ haptic('light'); MA.list.forEach(a=>{ MA.sel[a.id] = true; }); renderManage(); }
function maClearAll(){ haptic('light'); MA.sel = {}; renderManage(); }
window.maSelectAll = maSelectAll;
window.maClearAll = maClearAll;
async function maRun(kind, path, body, done){
  if(MA.busy) return;
  const ids = maSelectedIds();
  if(!ids.length){ toast('Select at least one account', 'err'); return; }
  MA.busy = kind; renderManage();
  let d = null;
  try{
    d = await api(path, {method:'POST', body: Object.assign({account_ids: ids}, body||{})});
  }catch(e){ d = {error:'Network error — try again'}; }
  MA.busy = false;
  if(d && d.error){ haptic('err'); toast(d.error, 'err'); }
  else { haptic('ok'); if(done) done(d, ids); }
  await maFetch();
  renderManage();
}
function maRefreshBulk(){
  maRun('refresh', '/api/accounts/refresh_bulk', null, (d)=>{
    const rows = (d && Array.isArray(d.results)) ? d.results : [];
    const ok = rows.filter(x=>x.ok).length;
    MA.results = { title: '🔄 Refreshed '+ok+'/'+rows.length+' session'+(rows.length===1?'':'s'), rows: rows };
    toast(ok+' of '+rows.length+' refreshed', ok===rows.length ? 'ok' : 'err');
  });
}
function maExportBulk(){
  maRun('export', '/api/accounts/export_files', null, (d)=>{
    const n = (d && (d.sent!=null ? d.sent : maSelectedIds().length)) || 0;
    const failed = (d && Array.isArray(d.failed)) ? d.failed : [];
    MA.results = failed.length
      ? { title: '📤 Sent '+n+' · '+failed.length+' failed',
          rows: failed.map(f=>({mobile: f.mobile || f.id, ok: false, error: f.error})) }
      : null;
    toast(n+' session file'+(n===1?'':'s')+' sent to your Telegram chat 📤',
          failed.length ? 'err' : 'ok');
  });
}
function maConfirmDelete(){
  if(MA.busy) return;
  const ids = maSelectedIds();
  if(!ids.length){ toast('Select at least one account', 'err'); return; }
  haptic('med');
  openSheet('<div class="ml-conf"><div class="art">🗑</div>' +
    '<h3>Delete '+ids.length+' account'+(ids.length===1?'':'s')+'?</h3>' +
    '<p>This removes the saved session'+(ids.length===1?'':'s')+' from the bot. This cannot be undone.</p>' +
    '<div class="cbtns"><button class="no" onclick="closeSheet()">Cancel</button>' +
    '<button class="yes" onclick="maDoDelete()">Yes, delete</button></div></div>');
}
function maDoDelete(){
  closeSheet();
  maRun('delete', '/api/accounts/delete', null, (d, ids)=>{
    const n = (d && d.deleted!=null) ? d.deleted : ids.length;
    MA.results = null; MA.sel = {};
    toast(n+' account'+(n===1?'':'s')+' deleted', 'ok');
  });
}
window.maRefreshBulk = maRefreshBulk;
window.maExportBulk = maExportBulk;
window.maConfirmDelete = maConfirmDelete;
window.maDoDelete = maDoDelete;

/* ================= CHECK PRICE (?view=price) ================= */
const CP = { link:'', sel:{}, busy:false, data:null, err:'' };
async function openCheckPrice(){
  haptic('light');
  CP.sel = {}; CP.data = null; CP.err = ''; CP.busy = false;
  S.detailStack.push('price'); syncBackButton();
  const host = document.getElementById('detailHost');
  host.innerHTML = '<div class="detail"><div class="detail-top"><button class="back-btn" onclick="closeDetail()">←</button>'
    + '<div class="ttl">Check Price</div></div><div class="ml-pad" id="cpBody">'
    + '<div class="center-load"><div class="spinner"></div></div></div></div>';
  await maFetch();
  MA.list.forEach(a=>{ CP.sel[a.id] = true; });
  renderCheckPrice();
}
window.openCheckPrice = openCheckPrice;
function cpSelectedIds(){ return MA.list.filter(a=>CP.sel[a.id]).map(a=>a.id); }
function renderCheckPrice(){
  const b = document.getElementById('cpBody');
  if(!b) return;
  const n = cpSelectedIds().length;
  let h = '<div class="cp-box"><label for="cpLink">Meesho product link</label>' +
    '<input id="cpLink" placeholder="https://meesho.com/…" autocomplete="off" value="'+esc(CP.link)+'">' +
    '<button class="cp-go" id="cpGoBtn"'+(CP.busy?' disabled':'')+'>' +
    (CP.busy ? '<span class="mini-spin"></span> Checking…' : '🔍 Check price') + '</button></div>';
  if(CP.err) h += '<div class="cp-sum" style="background:var(--berry-bg);color:var(--berry)">'+esc(CP.err)+'</div>';
  if(CP.data) h += cpResultsHtml();
  h += '<div class="ml-head"><div class="mh-stats">' +
    '<span class="ml-pill">👥 '+MA.list.length+' account'+(MA.list.length===1?'':'s')+'</span>' +
    '<span class="ml-pill sel">✓ '+n+' selected</span></div>' +
    '<div class="mh-acts"><button onclick="cpSelectAll()">Select all</button>' +
    '<button onclick="cpClearAll()">Clear</button></div></div>';
  h += maRowsHtml(CP.sel, 'cpid');
  b.innerHTML = h;
  b.querySelectorAll('[data-cpid]').forEach(r=>r.addEventListener('click', ()=>cpToggle(r.dataset.cpid)));
  const inp = document.getElementById('cpLink');
  if(inp){
    inp.addEventListener('input', ()=>{ CP.link = inp.value; });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); cpCheck(); } });
  }
  const go = document.getElementById('cpGoBtn');
  if(go) go.addEventListener('click', cpCheck);
}
function cpToggle(id){
  const a = MA.list.find(x=>String(x.id)===String(id));
  if(!a) return;
  haptic('light');
  if(CP.sel[a.id]) delete CP.sel[a.id]; else CP.sel[a.id] = true;
  renderCheckPrice();
}
function cpSelectAll(){ haptic('light'); MA.list.forEach(a=>{ CP.sel[a.id] = true; }); renderCheckPrice(); }
function cpClearAll(){ haptic('light'); CP.sel = {}; renderCheckPrice(); }
window.cpSelectAll = cpSelectAll;
window.cpClearAll = cpClearAll;
function cpResultsHtml(){
  const d = CP.data || {};
  const p = d.product || {};
  const all = Array.isArray(d.results) ? d.results : [];
  const good = x => x && !x.error && x.price!=null;
  const pay = x => (x.offer_price!=null ? Number(x.offer_price) : Number(x.price));
  const ok = all.filter(good).slice().sort((a,b)=>pay(a)-pay(b));
  const bad = all.filter(x=>!good(x));
  let h = '';
  if(p.name || p.image){
    h += '<div class="cp-prod">' + (p.image ? imgTag(p.image) : '') +
      '<div class="pn">'+esc(p.name||'Product')+'</div></div>';
  }
  if(ok.length > 1){
    const diff = pay(ok[ok.length-1]) - pay(ok[0]);
    if(diff > 0) h += '<div class="cp-sum">🎉 '+rupee(diff)+' cheaper than the costliest account</div>';
    else h += '<div class="cp-sum">Same price on all '+ok.length+' accounts</div>';
  }
  const medals = ['🥇','🥈','🥉'];
  h += ok.map((r,i)=>{
    const hasOffer = r.offer_price!=null && Number(r.offer_price) < Number(r.price);
    const big = hasOffer ? Number(r.offer_price) : Number(r.price);
    // offer price is what you actually pay → the real listed price sits next to it
    const cut = hasOffer ? '<span class="cp-mrp">'+rupee(r.price)+'</span>' : '';
    const mrp = (r.mrp!=null && Number(r.mrp) !== big && Number(r.mrp) !== Number(r.price))
      ? '<span class="cp-mrp">'+rupee(r.mrp)+'</span>' : '';
    const oos = (r.in_stock === false) ? '<span class="cp-oos">out of stock</span>' : '';
    const off = hasOffer
      ? '<div class="cp-off">🏷 '+esc(r.offer_text || ('Save '+rupee(Number(r.price)-Number(r.offer_price))))+'</div>'
      : '';
    return '<div class="cp-row'+(i===0?' best':'')+'">' +
      '<div class="cp-rank'+(i>2?' n':'')+'">'+(i<3?medals[i]:('#'+(i+1)))+'</div>' +
      '<div class="cp-l"><div class="cp-price">'+rupee(big)+cut+mrp+oos+'</div>' + off +
      '<div class="cp-who">+91 '+esc(fmtMobile(r.mobile))+'</div></div></div>';
  }).join('');
  if(!ok.length && !bad.length) h += '<div class="empty"><div class="art">🔍</div><h3>No results</h3><p>Try another link.</p></div>';
  if(bad.length){
    h += '<div class="cp-fail"><h4>Couldn’t check '+bad.length+' account'+(bad.length===1?'':'s')+'</h4>' +
      bad.map(r=>'<div class="fr"><b>+91 '+esc(fmtMobile(r.mobile))+'</b> — '+esc(r.error||'failed')+'</div>').join('') +
      '</div>';
  }
  return h;
}
async function cpCheck(){
  if(CP.busy) return;
  const inp = document.getElementById('cpLink');
  if(inp) CP.link = inp.value;
  const link = String(CP.link||'').trim();
  if(!link){ toast('Paste a Meesho product link', 'err'); return; }
  const ids = cpSelectedIds();
  if(!ids.length){ toast('Select at least one account', 'err'); return; }
  CP.busy = true; CP.err = ''; CP.data = null;
  renderCheckPrice();
  let d = null;
  try{
    d = await api('/api/price/check', {method:'POST', body:{link: link, account_ids: ids}});
  }catch(e){ d = {error:'Network error — try again'}; }
  CP.busy = false;
  if(d && d.error){ CP.err = d.message || d.error; haptic('err'); }
  else { CP.data = d || {}; haptic('ok'); }
  renderCheckPrice();
}
window.cpCheck = cpCheck;

renderSearchShell();
bootstrap().then(function(){
  try{ if(new URLSearchParams(location.search).get('view')==='history') openWalletHistory(); }catch(e){}
  try{ if(new URLSearchParams(location.search).get('view')==='manage') openManageAccounts(); }catch(e){}
  try{ if(new URLSearchParams(location.search).get('view')==='price') openCheckPrice(); }catch(e){}
  try{ resumePendingUpi(); }catch(e){}   // resume a UPI payment left pending before a refresh
});
