<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meesho Shop</title>
<script src="UnknownGuy_js/telegram-web-app.js"></script>
<link rel="stylesheet" href="UnknownGuy_css/leaflet.css"/>
<script src="UnknownGuy_js/leaflet.js"></script>
<style>
/* ══════════════════════════════════════════════════
   MEESHO MINI — "ROYAL BLUE" design language
   clean · premium · rounded · springy
   ══════════════════════════════════════════════════ */
:root{
  --pink:#2F6BFF;
  --grape:#7C5CFF;
  --coral:#22B8A6;
  --candy:linear-gradient(118deg,#2F6BFF 0%,#4A63FF 55%,#7C5CFF 115%);
  --candy-soft:linear-gradient(118deg,rgba(47,107,255,.12),rgba(74,99,255,.10) 55%,rgba(124,92,255,.12));
  --bg:#F2F4FA;
  --bg-glow:none;
  --surface:#FFFFFF;
  --surface2:#F5F7FC;
  --glass:rgba(255,255,255,.92);
  --ink:#101528;
  --ink2:#5B6478;
  --ink3:#9AA3B8;
  --line:#E3E8F2;
  --mint:#0EAE6E;
  --mint-bg:#DDF8EC;
  --sun:#C77C0A;
  --sun-bg:#FFF0D4;
  --sky:#3B6CF0;
  --sky-bg:#E4EDFF;
  --berry:#E23A5F;
  --berry-bg:#FFE4EB;
  --puff:0 4px 14px rgba(47,107,255,.07),0 12px 34px rgba(124,92,255,.10);
  --puff-lg:0 10px 26px rgba(47,107,255,.16),0 26px 70px rgba(124,92,255,.22);
  --glow:0 10px 26px rgba(47,107,255,.35),0 3px 9px rgba(91,124,255,.28);
  --sk1:#E8EDF8;
  --sk2:#F4F7FD;
  --chip:#E4EBFF;
  --dim:rgba(15,23,42,.5);
  --spring:cubic-bezier(.34,1.7,.5,1);
  --jelly:cubic-bezier(.34,2.2,.44,.9);
  --swoosh:cubic-bezier(.22,.9,.3,1);
}
/* single light theme only — dark mode removed */
/* legacy aliases so any inline var() refs keep resolving */
:root{
  --brand:var(--pink);--purple:var(--grape);--grad:var(--candy);--grad-soft:var(--candy-soft);
  --text:var(--ink);--text2:var(--ink2);--text3:var(--ink3);--border:var(--line);
  --green:var(--mint);--green-bg:var(--mint-bg);--amber:var(--sun);--amber-bg:var(--sun-bg);
  --blue:var(--sky);--blue-bg:var(--sky-bg);--red:var(--berry);--red-bg:var(--berry-bg);
  --shadow:var(--puff);--shadow-lg:var(--puff-lg);
  --skeleton1:var(--sk1);--skeleton2:var(--sk2);
  --overlay:var(--dim);--ease-spring:var(--spring);--ease-out:var(--swoosh);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;width:100%;max-width:100vw;margin:0}
#main,.view,.page-pad{max-width:100%;min-width:0}
img{max-width:100%}
body{
  background:var(--bg);
  background-image:var(--bg-glow);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"SF Pro Rounded",ui-rounded,"Hiragino Maru Gothic ProN","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:15px;line-height:1.5;letter-spacing:-.005em;
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;letter-spacing:inherit}
input{font-family:inherit}
img{display:block}
.hidden{display:none!important}
::selection{background:rgba(47,107,255,.25)}

@keyframes floatIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes jellyTap{0%{transform:scale(1)}40%{transform:scale(.88,.94)}70%{transform:scale(1.06,.98)}100%{transform:scale(1)}}
@keyframes wobble{0%{transform:rotate(0)}30%{transform:rotate(-8deg)}60%{transform:rotate(6deg)}100%{transform:rotate(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes confettiFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--cx),var(--cy)) scale(.3) rotate(300deg);opacity:0}}

/* ─── top bar : floating candy capsule ─── */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:8px;
  margin:0 10px;
  padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  backdrop-filter:blur(20px) saturate(1.8);
  border:2px solid var(--line);border-top:none;
  border-radius:0 0 28px 28px;
  box-shadow:var(--puff);
}
.brand-mark{
  width:42px;height:42px;border-radius:16px;
  background:var(--candy);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;font-size:21px;flex:0 0 auto;
  box-shadow:var(--glow);
  transform:rotate(-6deg);
  position:relative;overflow:hidden;
}
.brand-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.5),transparent 50%)}
.acct-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--chip);
  border:2px solid transparent;
  border-radius:999px;
  padding:9px 14px;
  font-weight:800;font-size:13.5px;color:var(--pink);
  min-width:0;flex:1 1 auto;
  box-shadow:inset 0 0 0 1px rgba(47,107,255,.14);
  transition:transform .18s var(--jelly);
}
.acct-pill:active{animation:jellyTap .4s var(--spring)}
.acct-pill .num{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-pill .caret{opacity:.6;font-size:10px;flex:0 0 auto}
.acct-pill .ordered-dot{flex:0 0 auto;font-size:12px;line-height:1}
.wallet-chip{
  display:flex;align-items:center;gap:4px;
  background:var(--candy);color:#fff;
  border-radius:999px;padding:8px 13px;
  font-weight:900;font-size:12.5px;flex:0 0 auto;white-space:nowrap;
  box-shadow:var(--glow);
}
.top-cart{
  position:relative;width:42px;height:42px;border-radius:16px;
  background:var(--surface);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex:0 0 auto;box-shadow:var(--puff);
  transition:transform .18s var(--jelly);
}
.top-cart:active{animation:jellyTap .4s var(--spring)}
.top-cart .tab-badge{top:-5px;right:-5px}

/* ─── layout ─── */
.view{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.page-pad{padding:18px 16px calc(170px + env(safe-area-inset-bottom))}
.top-cart{display:none !important}
.page-title{
  font-size:27px;font-weight:900;letter-spacing:-.04em;margin-bottom:16px;
  background:var(--candy);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  width:max-content;max-width:100%;
}

/* ─── bubbly bottom nav with springing blob ─── */
.tabbar{
  position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;
  display:flex;position:fixed;
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.8);
  backdrop-filter:blur(22px) saturate(1.8);
  border:2px solid var(--line);
  border-radius:999px;
  box-shadow:var(--puff-lg);
  padding:7px;
  overflow:hidden;
}
.nav-blob{
  position:absolute;top:7px;bottom:7px;left:0;width:60px;
  border-radius:999px;background:var(--candy);
  box-shadow:var(--glow);
  transition:left .45s var(--spring),width .45s var(--spring);
  z-index:0;
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 0 7px;
  color:var(--ink3);
  font-size:9.5px;font-weight:800;letter-spacing:.03em;
  border-radius:999px;position:relative;z-index:1;
  transition:color .25s ease;
}
.tabbar button .ico{font-size:21px;line-height:1;transition:transform .35s var(--spring)}
.tabbar button.active{color:#fff}
.tabbar button.active .ico{
  transform:translateY(-3px) scale(1.18);animation:wobble .5s var(--spring);
  /* white halo so dark emoji (👤/🪪) stay readable on the blue blob */
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 1px 3px rgba(0,0,0,.25));
}
.tabbar button:active .ico{transform:scale(.8)}
.icon-wrap{position:relative;display:inline-block}
.tab-badge{
  position:absolute;top:-6px;right:-11px;
  min-width:17px;height:17px;padding:0 4px;
  background:#fff;color:var(--pink);
  border-radius:999px;font-size:9.5px;font-weight:900;
  display:flex;align-items:center;justify-content:center;line-height:1;
  border:2px solid var(--pink);
  box-shadow:0 2px 8px rgba(47,107,255,.4);
}
.top-cart .tab-badge{background:var(--pink);color:#fff;border-color:var(--surface)}

/* ─── search : conversational bubble ─── */
.search-row{display:flex;gap:9px;margin-bottom:16px}
.search-box{
  flex:1;display:flex;align-items:center;gap:9px;
  background:var(--surface);
  border:2px solid var(--line);
  border-radius:999px;
  padding:0 18px;height:54px;
  box-shadow:var(--puff);
  transition:border-color .2s ease,box-shadow .25s ease,transform .2s var(--spring);
}
.search-box:focus-within{border-color:var(--pink);transform:scale(1.015);box-shadow:0 0 0 5px rgba(47,107,255,.12),var(--puff)}
.search-box .mag{font-size:16px}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:15px;font-weight:600;color:var(--ink);min-width:0}
.search-box input::placeholder{color:var(--ink3);font-weight:600}
.search-btn{
  height:54px;padding:0 21px;border-radius:999px;
  background:var(--candy);color:#fff;font-weight:900;font-size:14.5px;
  box-shadow:var(--glow);
  transition:transform .18s var(--jelly);
}
.search-btn:active{animation:jellyTap .4s var(--spring)}
.mood-row{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:2px 16px 6px}
.mood-row::-webkit-scrollbar{display:none}
.mood-chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:2px solid var(--line);
  border-radius:999px;padding:9px 16px;
  font-size:13px;font-weight:800;color:var(--ink2);
  box-shadow:var(--puff);
  transition:transform .2s var(--jelly),border-color .2s;
}
.mood-chip:active{animation:jellyTap .4s var(--spring);border-color:var(--pink)}
.recent-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.recent-head span{font-size:13px;font-weight:800;color:var(--ink2)}
.recent-clear{font-size:12.5px;font-weight:800;color:var(--pink);padding:6px 12px;border-radius:999px;background:var(--surface2)}
.recent-clear:active{transform:scale(.94)}
.recent-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.recent-chip{
  background:var(--surface2);border:2px dashed var(--line);
  border-radius:999px;padding:7px 15px;
  font-size:12.5px;color:var(--ink2);font-weight:700;
  transition:transform .2s var(--jelly),border-color .2s;
}
.recent-chip:active{animation:jellyTap .4s var(--spring);border-color:var(--pink)}
.corrected{font-size:13px;color:var(--ink2);font-weight:600;margin-bottom:10px}
.corrected b{color:var(--pink)}

/* ─── sort / filter chips — fully transparent row, no track ─── */
.filter-chips{display:flex;gap:9px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none;background:transparent;border:none;box-shadow:none}
.filter-chips::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
.fchip{
  flex:0 0 auto;padding:9px 18px;border-radius:999px;
  background:var(--surface);border:2px solid var(--line);
  font-size:13px;font-weight:800;color:var(--ink2);
  box-shadow:var(--puff);
  transition:all .3s var(--spring);
}
.fchip.on{background:var(--candy);color:#fff;border-color:transparent;box-shadow:var(--glow);transform:scale(1.05)}
.fchip:active{transform:scale(.92)}

/* ─── product grid : squircle candy cards ─── */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:100%}
.pcard{min-width:0;max-width:100%}
.pcard .imgwrap img{width:100%;height:100%}
.pcard{
  background:var(--surface);
  border-radius:28px;
  border:2px solid var(--line);
  box-shadow:var(--puff);
  padding:6px 6px 9px;
  transition:transform .25s var(--spring),box-shadow .25s ease;
}
.pcard:active{transform:scale(.94) rotate(-.6deg);box-shadow:var(--puff-lg)}
.pcard .imgwrap{position:relative;aspect-ratio:1/1.05;border-radius:20px;overflow:hidden;background:var(--surface2)}
.pcard img{width:100%;height:100%;object-fit:cover}
.mall-badge{
  position:absolute;top:9px;left:9px;
  background:var(--candy);color:#fff;
  font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;
  box-shadow:0 3px 10px rgba(47,107,255,.45);
}
.pcard .body{padding:7px 4px 0}
.pcard .name{
  font-size:12px;color:var(--ink2);font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.55em;margin-bottom:5px;
}
.price-line{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.price-line .p{
  background:var(--chip);color:var(--pink);
  font-weight:900;font-size:13px;letter-spacing:-.02em;
  padding:2px 9px;border-radius:999px;
}
.price-line .mrp{font-size:10.5px;color:var(--ink3);text-decoration:line-through;font-weight:600}
.price-line .off{font-size:10px;color:var(--mint);font-weight:900}
.meta-line{display:flex;align-items:center;gap:5px;margin-top:5px;min-width:0}
.rating-badge{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--mint-bg);color:var(--mint);
  font-size:10px;font-weight:900;
  padding:2px 8px;border-radius:999px;flex:0 0 auto;
}
.rating-badge.mid{background:var(--sun-bg);color:var(--sun)}
.rating-badge.low{background:var(--berry-bg);color:var(--berry)}
.supplier{font-size:10px;color:var(--ink3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.offer-tag{display:inline-flex;align-items:center;gap:3px;color:var(--grape);font-size:11px;font-weight:800;margin-top:6px}
.speed-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.speed-chip{
  background:var(--sky-bg);color:var(--sky);
  font-size:8.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
}
.addpill{
  margin-top:7px;display:flex;align-items:center;justify-content:center;
  height:28px;border-radius:999px;
  background:var(--candy);color:#fff;
  font-size:11.5px;font-weight:900;
  box-shadow:0 4px 12px rgba(47,107,255,.3);
}
.load-more{
  display:block;margin:18px auto 6px;padding:13px 30px;border-radius:999px;
  background:var(--chip);color:var(--pink);border:2px solid var(--pink);
  font-weight:900;font-size:14px;transition:transform .2s var(--jelly);
}
.load-more:active{animation:jellyTap .4s var(--spring)}
.load-more[disabled]{opacity:.5}

/* ─── skeleton shimmer ─── */
.sk{
  background:linear-gradient(100deg,var(--sk1) 30%,var(--sk2) 50%,var(--sk1) 70%);
  background-size:200% 100%;
  animation:shimmer 1.3s infinite;
  border-radius:12px;
}
.sk-card{background:var(--surface);border-radius:28px;border:2px solid var(--line);padding:8px 8px 12px;overflow:hidden}
.sk-card .sk-img{aspect-ratio:1/1.05;border-radius:20px}
.sk-card .b{padding:10px 5px 0;display:flex;flex-direction:column;gap:9px}
.sk-line{height:11px}

/* ─── big emoji empty states ─── */
.empty{text-align:center;padding:56px 30px;animation:floatIn .5s var(--swoosh) both}
.empty .art{
  width:110px;height:110px;margin:0 auto 22px;
  border-radius:40px;
  background:var(--candy-soft);
  border:2px solid var(--line);
  box-shadow:var(--puff);
  display:flex;align-items:center;justify-content:center;
  font-size:54px;
  transform:rotate(-4deg);
  animation:pop .6s var(--spring) both;
}
.empty h3{font-size:20px;font-weight:900;margin-bottom:6px;letter-spacing:-.03em}
.empty p{color:var(--ink2);font-size:13.5px;font-weight:600;max-width:260px;margin:0 auto}
.empty .cta{
  margin-top:22px;display:inline-block;
  padding:14px 32px;border-radius:999px;
  background:var(--candy);color:#fff;font-weight:900;font-size:14px;
  box-shadow:var(--glow);
  transition:transform .2s var(--jelly);
}
.empty .cta:active{animation:jellyTap .4s var(--spring)}

/* ─── detail overlay ─── */
.detail{
  position:fixed;inset:0;z-index:50;
  background:var(--bg);background-image:var(--bg-glow);background-attachment:fixed;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(108px + env(safe-area-inset-bottom));
}
@keyframes detailUp{from{transform:translateY(6%) scale(.98);opacity:0}to{transform:none;opacity:1}}
.detail-top{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);
  backdrop-filter:blur(18px) saturate(1.7);
  border-bottom:2px solid var(--line);
}
.back-btn{
  width:42px;height:42px;border-radius:999px;
  background:var(--surface);border:2px solid var(--line);
  box-shadow:var(--puff);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--ink);flex:0 0 auto;
  transition:transform .2s var(--jelly);
}
.back-btn:active{animation:jellyTap .4s var(--spring)}
.detail-top .ttl{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}

.gallery{position:relative;margin:12px 16px 0;border-radius:30px;overflow:hidden;background:var(--surface2);border:2px solid var(--line);box-shadow:var(--puff-lg)}
.gallery .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery .track::-webkit-scrollbar{display:none}
.gallery .track img{width:100%;flex:0 0 100%;scroll-snap-align:center;aspect-ratio:3/3.4;object-fit:cover}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots span{
  width:7px;height:7px;border-radius:999px;
  background:rgba(255,255,255,.6);box-shadow:0 1px 5px rgba(0,0,0,.3);
  transition:all .35s var(--spring);
}
.dots span.on{background:#fff;width:22px}

.card{
  background:var(--surface);
  border-radius:26px;border:2px solid var(--line);
  box-shadow:var(--puff);
  padding:18px;margin:14px 16px 0;
  animation:floatIn .45s var(--swoosh) both;
}
.d-name{font-size:16px;font-weight:700;margin-bottom:11px;line-height:1.4}
.d-price{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.d-price .big{
  font-size:26px;font-weight:900;letter-spacing:-.03em;
  background:var(--candy);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.d-price .mrp{color:var(--ink3);text-decoration:line-through;font-size:14px;font-weight:600}
.d-price .off{color:var(--mint);font-weight:900;font-size:13px;background:var(--mint-bg);padding:3px 10px;border-radius:999px}
.prepaid-hint{
  margin-top:10px;display:inline-flex;align-items:center;gap:6px;
  background:var(--chip);color:var(--pink);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;
}
.d-meta{display:flex;align-items:center;gap:8px;margin-top:11px;flex-wrap:wrap}
.d-supplier{font-size:12.5px;color:var(--ink2);font-weight:600}
.mall-inline{
  background:var(--candy);color:#fff;font-size:9px;font-weight:900;
  padding:4px 10px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;
}
.seller-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surface2);border:2px solid var(--line);
  border-radius:999px;padding:4px 12px;
  font-size:11.5px;font-weight:800;color:var(--ink2);
}
.seller-badge .st{color:var(--sun)}
.brand-line{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:900;color:var(--grape);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;
}
.info-rows{margin-top:13px;display:flex;flex-direction:column;gap:9px}
.info-row{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink2)}
.info-row .k{font-size:15px}
.info-row.ok{color:var(--mint)}
.info-row.bad{color:var(--berry)}
.offer-strip{
  margin-top:12px;background:var(--mint-bg);color:var(--mint);
  border-radius:18px;padding:11px 15px;font-size:12.5px;font-weight:800;
}
.sec-title{font-size:15px;font-weight:900;margin-bottom:12px;letter-spacing:-.02em}

/* size bubbles */
.size-chips{display:flex;gap:10px;flex-wrap:wrap}
.size-chip{
  min-width:52px;padding:12px 17px;border-radius:999px;
  border:2px solid var(--line);background:var(--surface2);
  font-weight:900;font-size:13.5px;color:var(--ink2);
  transition:all .3s var(--spring);
}
.size-chip.on{
  border-color:transparent;background:var(--candy);color:#fff;
  transform:scale(1.1) rotate(-3deg);
  box-shadow:var(--glow);
}
.qty-row{display:flex;align-items:center;justify-content:space-between}
.stepper{display:flex;align-items:center;border-radius:999px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.stepper button{
  width:44px;height:44px;font-size:20px;font-weight:900;color:var(--pink);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s var(--spring),background .12s;
}
.stepper button:active{background:var(--chip);transform:scale(.8)}
.stepper button:disabled{color:var(--ink3);opacity:.5}
.stepper .qv{width:40px;text-align:center;font-weight:900;font-size:15px}

.kv-list{display:flex;flex-direction:column}
.kv{display:flex;gap:12px;padding:10px 0;border-bottom:2px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink3);flex:0 0 38%;font-weight:700}
.kv .v{color:var(--ink);flex:1;font-weight:600;white-space:pre-line}
.desc{font-size:13px;color:var(--ink2);font-weight:500;white-space:pre-line;margin-top:8px;line-height:1.65}
.line-item{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2);padding:6px 0}
.line-item.total{font-weight:900;color:var(--ink);font-size:15px;border-top:2px dashed var(--line);margin-top:5px;padding-top:11px}

.hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hl-cell{background:var(--surface2);border:2px solid var(--line);border-radius:18px;padding:11px 13px;min-width:0}
.hl-cell .hk{font-size:10px;color:var(--ink3);font-weight:900;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.hl-cell .hv{font-size:13px;font-weight:700;color:var(--ink);word-break:break-word}

.designs-strip{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:4px 18px 6px}
.designs-strip::-webkit-scrollbar{display:none}
.design-card{
  flex:0 0 96px;border-radius:20px;overflow:hidden;
  background:var(--surface2);border:2px solid var(--line);
  transition:transform .25s var(--spring),border-color .2s;
}
.design-card:active{transform:scale(.9) rotate(-2deg)}
.design-card.on{border-color:var(--pink);box-shadow:0 5px 14px rgba(47,107,255,.28);transform:scale(1.03)}
.design-card img{width:100%;aspect-ratio:1/1.1;object-fit:cover}
.design-card .dp{font-size:12px;font-weight:900;text-align:center;padding:6px 4px}
.design-card .oos{font-size:10px;color:var(--berry);text-align:center;padding-bottom:6px;font-weight:800}

/* review sentiment bars */
.sent-row{margin-bottom:13px}
.sent-row:last-child{margin-bottom:0}
.sent-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.sent-head img{width:18px;height:18px;object-fit:contain}
.sent-head .sl{font-size:13px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sent-head .sp{font-size:12px;font-weight:900}
.sent-bar{height:10px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.sent-bar .fill{height:100%;border-radius:999px;transition:width .7s var(--swoosh)}
.sent-sub{font-size:11px;color:var(--ink3);font-weight:600;margin-top:4px}

/* sticky PDP CTA */
.sticky-cta{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;gap:10px;
  padding:13px 16px calc(14px + env(safe-area-inset-bottom));
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  backdrop-filter:blur(20px) saturate(1.8);
  border-top:2px solid var(--line);
  border-radius:28px 28px 0 0;
}
.cta-secondary{
  flex:1;height:54px;border-radius:999px;
  border:2px solid var(--pink);color:var(--pink);
  font-weight:900;font-size:14.5px;background:var(--chip);
  transition:transform .2s var(--jelly);
}
.cta-primary{
  flex:1.4;height:54px;border-radius:999px;
  background:var(--candy);color:#fff;
  font-weight:900;font-size:14.5px;
  box-shadow:var(--glow);
  transition:transform .2s var(--jelly),filter .15s;
}
.cta-primary:active,.cta-secondary:active{animation:jellyTap .4s var(--spring)}
.cta-primary[disabled]{opacity:.55;box-shadow:none}

/* ─── cart ─── */
.ccard{
  background:var(--surface);border:2px solid var(--line);
  border-radius:20px;box-shadow:var(--puff);
  padding:8px;margin-bottom:10px;
  display:flex;gap:10px;
  animation:floatIn .45s var(--swoosh) both;
}
.ccard img{width:76px;height:88px;border-radius:14px;object-fit:cover;background:var(--surface2);flex:0 0 auto}
.ccard .cbody{min-width:0;flex:1;padding:2px 4px 2px 0}
.ccard .cname{font-size:12.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .csup{font-size:11px;color:var(--ink3);font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .ctags{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.ctag{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:800;color:var(--ink2)}
.ccard .cprice{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.ccard .cprice .p{background:var(--chip);color:var(--pink);font-weight:900;font-size:12.5px;padding:2px 9px;border-radius:999px}
.ccard .cprice .mrp{font-size:12px;color:var(--ink3);text-decoration:line-through;font-weight:600}
.price-drop{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--mint-bg);color:var(--mint);
  border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;margin-top:6px;
}
.price-drop b{font-weight:900}
.item-deliv{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink2);margin-top:4px;flex-wrap:wrap}
.item-deliv .free{color:var(--mint);font-weight:900}
.mini-step{display:flex;align-items:center;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface2)}
.mini-step button{width:33px;height:33px;font-size:17px;font-weight:900;color:var(--pink);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--spring),background .12s}
.mini-step button:active{background:var(--chip);transform:scale(.75)}
.mini-step button:disabled{color:var(--ink3);opacity:.5}
.mini-step .qv{width:30px;text-align:center;font-weight:900;font-size:13.5px}
.trash-btn{
  width:33px;height:33px;border-radius:999px;
  background:var(--berry-bg);color:var(--berry);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s var(--jelly);
}
.trash-btn:active{animation:jellyTap .4s var(--spring)}
.cart-updating{opacity:.5;pointer-events:none;filter:saturate(.6);transition:opacity .15s ease}

/* easy-returns toggle pills — compact inline */
.ret-block{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ret-head{font-size:10.5px;font-weight:900;color:var(--ink3);margin:0}
.ret-pills{display:inline-flex;gap:6px;flex-wrap:wrap}
.ret-pill{
  border:1.5px solid var(--line);background:var(--surface2);
  border-radius:999px;padding:3px 10px;
  font-size:10.5px;font-weight:900;color:var(--ink2);
  display:inline-flex;align-items:center;gap:5px;
  text-align:left;transition:all .3s var(--spring);
}
.ret-pill.on{border-color:transparent;background:var(--candy);color:#fff;box-shadow:0 3px 9px rgba(47,107,255,.3)}
.ret-pill .rp{display:inline;font-size:10px;font-weight:700;opacity:.85;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ret-static{font-size:11.5px;color:var(--ink3);font-weight:700}

.warn-banner{
  display:flex;align-items:center;gap:10px;
  background:var(--sun-bg);color:var(--sun);
  border:2px solid rgba(199,124,10,.25);
  border-radius:20px;padding:12px 15px;margin-bottom:14px;
  font-size:13px;font-weight:800;
  animation:pop .45s var(--spring) both;
}
.warn-banner .x{margin-left:auto;font-size:15px;font-weight:900;color:var(--sun);padding:2px 6px}

.loc-strip{
  display:flex;align-items:center;gap:11px;
  background:var(--surface);border:2px solid var(--line);
  border-radius:24px;box-shadow:var(--puff);
  padding:13px 15px;margin-bottom:14px;
}
.loc-strip.loc-warn{border-color:var(--berry);background:var(--berry-bg)}
.loc-strip.loc-warn .change{color:#fff;background:var(--berry)}
.loc-strip .li{font-size:19px;flex:0 0 auto}
.loc-strip .lt{min-width:0;flex:1;font-size:13px;font-weight:600;color:var(--ink2)}
.loc-strip .lt b{color:var(--ink);font-size:13.5px;font-weight:800}
.loc-strip .lt .l2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.loc-strip .change{
  font-size:12.5px;font-weight:900;color:var(--pink);
  background:var(--chip);border-radius:999px;padding:8px 16px;flex:0 0 auto;
  transition:transform .2s var(--jelly);
}
.loc-strip .change:active{animation:jellyTap .4s var(--spring)}
.loc-strip .type-badge{margin-left:6px;vertical-align:1px}

/* expandable price rows */
.pb-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2);padding:7px 0}
.pb-row .neg{color:var(--mint);font-weight:900}
.pb-row.grand{font-weight:900;color:var(--ink);font-size:16px;border-top:2px dashed var(--line);margin-top:5px;padding-top:13px}
.pb-exp{cursor:pointer}
.pb-exp .chev{display:inline-block;font-size:10px;color:var(--ink3);margin-right:5px;transition:transform .3s var(--spring)}
.pb-exp.open .chev{transform:rotate(90deg)}
.pb-details{overflow:hidden;max-height:0;transition:max-height .3s var(--swoosh);margin-left:14px;border-left:3px solid var(--chip);padding-left:12px;border-radius:2px}
.pb-details.open{max-height:300px}
.pb-sub{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink3);padding:4px 0}
.pb-sub .neg{color:var(--mint);font-weight:900}
.pb-disclaimer{font-size:10.5px;color:var(--ink3);padding:4px 0 6px;line-height:1.45}
.price-banner{
  display:flex;align-items:center;gap:9px;
  border-radius:18px;padding:12px 14px;margin-bottom:12px;
  font-size:13px;font-weight:800;
  animation:pop .5s var(--spring) both;
}
.price-banner img{width:20px;height:20px;object-fit:contain;flex:0 0 auto}
.addr-mini{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:18px;padding:12px 14px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--ink2)}

.cart-sticky{
  position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:39;
  display:flex;align-items:center;gap:12px;
  padding:13px 18px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  backdrop-filter:blur(20px) saturate(1.8);
  border:2px solid var(--line);
  border-radius:30px;
  box-shadow:var(--puff-lg);
}
.cart-sticky .tot b{
  display:block;font-size:21px;font-weight:900;letter-spacing:-.03em;
  background:var(--candy);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.cart-sticky .tot span{font-size:11.5px;color:var(--ink3);font-weight:700}
.cart-sticky .proceed{
  margin-left:auto;height:50px;padding:0 30px;border-radius:999px;
  background:var(--candy);color:#fff;font-weight:900;font-size:14.5px;
  box-shadow:var(--glow);
  transition:transform .2s var(--jelly);
}
.cart-sticky .proceed:active{animation:jellyTap .4s var(--spring)}

/* ─── orders ─── */
.ocard{
  background:var(--surface);border:2px solid var(--line);
  border-radius:26px;box-shadow:var(--puff);
  padding:16px;margin-bottom:14px;
  animation:floatIn .45s var(--swoosh) both;
  transition:transform .25s var(--spring);
}
.ocard:active{transform:scale(.965) rotate(-.4deg)}
.ocard .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.ocard .oid{font-size:12px;color:var(--ink3);font-weight:800}
.status-pill{font-size:11px;font-weight:900;padding:5px 13px;border-radius:999px;text-transform:capitalize}
.st-green{background:var(--mint-bg);color:var(--mint)}
.st-blue{background:var(--sky-bg);color:var(--sky)}
.st-amber{background:var(--sun-bg);color:var(--sun)}
.st-red{background:var(--berry-bg);color:var(--berry)}
.st-grey{background:var(--surface2);color:var(--ink2)}
.ocard .items{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ocard .thumbs{display:flex}
.ocard .thumbs img{width:58px;height:58px;border-radius:18px;object-fit:cover;border:3px solid var(--surface);margin-left:-16px;background:var(--surface2)}
.ocard .thumbs img:first-child{margin-left:0}
.ocard .isum{min-width:0;flex:1}
.ocard .isum .n{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .isum .s{font-size:12px;color:var(--ink3);font-weight:600}
.ocard .foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink2);border-top:2px dashed var(--line);padding-top:10px}
.ocard .foot b{color:var(--ink);font-size:14px}
.deliv-line{font-size:12.5px;color:var(--sky);font-weight:800;margin-bottom:10px}

/* timeline */
.timeline{padding:4px 0 0 6px}
.tl-step{display:flex;gap:14px;position:relative;padding-bottom:24px}
.tl-step:last-child{padding-bottom:0}
.tl-step::before{content:"";position:absolute;left:10px;top:24px;bottom:0;width:3px;background:var(--line);border-radius:3px}
.tl-step:last-child::before{display:none}
.tl-step.done::before{background:var(--candy)}
.tl-dot{
  width:22px;height:22px;border-radius:999px;flex:0 0 auto;
  border:3px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;z-index:1;
  transition:all .35s var(--spring);
}
.tl-step.done .tl-dot{background:var(--candy);border-color:transparent;box-shadow:0 3px 10px rgba(47,107,255,.4)}
.tl-body .l{font-weight:900;font-size:13.5px}
.tl-step:not(.done) .tl-body .l{color:var(--ink3);font-weight:700}
.tl-body .d{font-size:12px;color:var(--ink3);font-weight:600}
.track-banner{display:flex;align-items:center;gap:12px;background:var(--mint-bg);border-radius:22px;padding:15px 16px}
.track-banner img{width:34px;height:34px;object-fit:contain;flex:0 0 auto}
.track-banner .tico{font-size:26px;flex:0 0 auto}
.track-banner .tt{font-weight:900;font-size:14px;color:var(--mint)}
.track-banner .td{font-size:12px;font-weight:600;color:var(--ink2)}
.addr-block{font-size:13px;font-weight:600;color:var(--ink2);line-height:1.65}
.addr-block b{color:var(--ink);font-size:13.5px;font-weight:800}

/* ─── account ─── */
.profile-card{
  background:var(--candy);
  border-radius:30px;padding:24px;color:#fff;
  box-shadow:var(--glow);
  display:flex;align-items:center;gap:16px;
  margin-bottom:16px;position:relative;overflow:hidden;
  animation:floatIn .45s var(--swoosh) both;
}
.profile-card::before{content:"✨";position:absolute;top:12px;right:16px;font-size:22px;opacity:.9}
.profile-card::after{content:"";position:absolute;bottom:-70px;right:-30px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.15);pointer-events:none}
.avatar{
  width:62px;height:62px;border-radius:24px;
  background:rgba(255,255,255,.25);
  border:2px solid rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;
  font-size:25px;font-weight:900;flex:0 0 auto;
  transform:rotate(-5deg);
  backdrop-filter:blur(4px);
}
.profile-card .info .m{font-size:18px;font-weight:900;letter-spacing:.01em}
.profile-card .info .s{font-size:12px;font-weight:600;opacity:.9;margin-top:2px}
.profile-card .badge{display:inline-block;margin-top:8px;background:rgba(255,255,255,.25);border-radius:999px;font-size:10.5px;font-weight:900;padding:4px 12px;letter-spacing:.05em}
.row-list{background:var(--surface);border:2px solid var(--line);border-radius:26px;box-shadow:var(--puff);overflow:hidden;margin-bottom:16px}
.lrow{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:15px 17px;text-align:left;
  border-bottom:2px dashed var(--line);
  font-size:14px;font-weight:800;color:var(--ink);
  transition:background .15s ease;
}
.lrow:last-child{border-bottom:none}
.lrow:active{background:var(--surface2)}
.lrow .lic{width:40px;height:40px;border-radius:16px;background:var(--candy-soft);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto;transform:rotate(-4deg)}
.lrow .lbl{flex:1;min-width:0}
.lrow .lbl .sub{display:block;font-size:11.5px;color:var(--ink3);font-weight:600}
.lrow .val{font-size:13px;color:var(--ink2);font-weight:800}
.lrow .chev{color:var(--ink3);font-size:13px}
.lrow .ordered-badge{margin-right:2px}
.switch-btn{
  font-size:12px;font-weight:900;color:var(--pink);
  background:var(--chip);border-radius:999px;padding:8px 16px;
  transition:transform .2s var(--jelly);
}
.switch-btn:active{animation:jellyTap .4s var(--spring)}
.acct-note{font-size:12px;font-weight:600;color:var(--ink3);text-align:center;padding:0 24px 8px}
.ordered-badge{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--mint-bg);color:var(--mint);
  border-radius:999px;padding:3px 9px;
  font-size:10px;font-weight:900;letter-spacing:.02em;
  flex:0 0 auto;white-space:nowrap;
}

/* ─── sheets ─── */
.sheet-overlay{position:fixed;inset:0;z-index:80;background:var(--dim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:81;
  background:var(--surface);
  border:2px solid var(--line);border-bottom:none;
  border-radius:34px 34px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  animation:sheetUp .42s var(--spring) both;
  max-height:75vh;overflow-y:auto;
  box-shadow:var(--puff-lg);
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:6px auto 16px}
.sheet h3{font-size:18px;font-weight:900;margin-bottom:13px;letter-spacing:-.02em}
.sheet-acct{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:13px 6px;text-align:left;
  border-bottom:2px dashed var(--line);
  transition:background .12s ease;
}
.sheet-acct:active{background:var(--surface2)}
.sheet-acct:last-child{border-bottom:none}
.sheet-acct .av{
  width:44px;height:44px;border-radius:18px;flex:0 0 auto;
  background:var(--candy-soft);color:var(--pink);
  border:2px solid var(--chip);transform:rotate(-4deg);
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;
}
.sheet-acct .m{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:6px}
.sheet-acct .s{font-size:11.5px;color:var(--ink3);font-weight:600}
.sheet-acct .tick{margin-left:auto;color:var(--pink);font-size:17px;font-weight:900}
.sheet-addr{
  width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;
  padding:13px 6px;border-bottom:2px dashed var(--line);
  transition:background .12s ease;
}
.sheet-addr:active{background:var(--surface2)}
.sheet-addr:last-child{border-bottom:none}
.sheet-addr.on .san{color:var(--pink)}
.sheet-addr .sai{font-size:18px;flex:0 0 auto;margin-top:2px}
.sheet-addr .san{font-weight:900;font-size:13.5px}
.sheet-addr .sad{font-size:12px;color:var(--ink3);font-weight:600;line-height:1.5}
.sheet-addr .tick{margin-left:auto;color:var(--pink);font-weight:900;font-size:16px}

/* cart success + confetti */
.cart-ok{text-align:center;padding:8px 0 6px;position:relative}
.cart-ok .big-check{
  width:76px;height:76px;border-radius:28px;margin:8px auto 16px;
  background:var(--candy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:34px;
  box-shadow:var(--glow);transform:rotate(-6deg);
  animation:pop .55s var(--spring) both;
}
.cart-ok h3{margin-bottom:4px}
.cart-ok p{color:var(--ink2);font-size:13.5px;font-weight:600}
.cart-ok .sum{display:flex;justify-content:space-around;background:var(--surface2);border:2px dashed var(--line);border-radius:22px;padding:14px;margin:17px 0}
.cart-ok .sum .cell b{display:block;font-size:18px;font-weight:900;letter-spacing:-.02em}
.cart-ok .sum .cell span{font-size:11.5px;color:var(--ink3);font-weight:700}
.cart-ok .done-btn{
  width:100%;height:52px;border-radius:999px;
  background:var(--candy);color:#fff;font-weight:900;font-size:14.5px;
  box-shadow:var(--glow);
  transition:transform .2s var(--jelly);
}
.cart-ok .done-btn:active{animation:jellyTap .4s var(--spring)}
.confetti-bit{
  position:absolute;top:44px;left:50%;
  font-size:15px;pointer-events:none;z-index:5;
  animation:confettiFly .9s var(--swoosh) both;
}

/* ─── address tab ─── */
.acard{
  background:var(--surface);border:2px solid var(--line);
  border-radius:26px;box-shadow:var(--puff);
  padding:16px;margin-bottom:14px;position:relative;
  animation:floatIn .45s var(--swoosh) both;
}
.acard.default{border-color:var(--pink);box-shadow:0 0 0 4px rgba(47,107,255,.1),var(--puff)}
.acard .ahead{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.acard .aname{font-weight:900;font-size:15px;letter-spacing:-.01em}
.type-badge{
  background:var(--sky-bg);color:var(--sky);
  border-radius:999px;padding:3px 10px;font-size:10px;font-weight:900;
  text-transform:uppercase;letter-spacing:.05em;
}
.default-ribbon{margin-left:auto;background:var(--candy);color:#fff;border-radius:999px;padding:4px 13px;font-size:11px;font-weight:900;box-shadow:0 3px 10px rgba(47,107,255,.35)}
.acard .atext{font-size:13px;font-weight:600;color:var(--ink2);line-height:1.6}
.acard .amob{font-size:12.5px;color:var(--ink3);margin-top:5px;font-weight:700}
.not-serviceable{margin-top:8px;background:var(--berry-bg);color:var(--berry);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;display:inline-block}
.acard .aactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;border-top:2px dashed var(--line);padding-top:12px}
.edit-btn{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12.5px;font-weight:900;color:var(--ink2);
  border:2px solid var(--line);border-radius:999px;padding:8px 15px;
  background:var(--surface);cursor:pointer;
  transition:all .3s var(--spring);
}
.edit-btn:active{transform:scale(.9)}
.edit-btn:disabled{opacity:.6}
.edit-btn.rnd{color:var(--berry);border-color:var(--berry);background:var(--berry-bg)}
.star-btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:900;color:var(--ink2);
  border:2px solid var(--line);border-radius:999px;padding:8px 17px;
  transition:all .3s var(--spring);
}
.star-btn:active{transform:scale(.9)}
.star-btn.on{color:#fff;border-color:transparent;background:var(--candy);box-shadow:0 4px 12px rgba(47,107,255,.3)}
.add-addr-btn{
  width:100%;height:56px;border-radius:999px;
  border:2px dashed var(--pink);color:var(--pink);
  font-weight:900;font-size:15px;background:var(--chip);
  margin-bottom:16px;
  transition:transform .2s var(--jelly);
}
.add-addr-btn:active{animation:jellyTap .4s var(--spring)}
.copy-callout{
  background:var(--candy-soft);
  border:2px solid var(--line);border-radius:26px;
  padding:16px;margin-bottom:16px;
}
.copy-callout p{font-size:12.5px;font-weight:600;color:var(--ink2);margin:5px 0 12px}
.copy-callout .ct{font-weight:900;font-size:14.5px}
.copy-btn{
  width:100%;height:50px;border-radius:999px;
  background:var(--candy);color:#fff;font-weight:900;font-size:13.5px;
  box-shadow:var(--glow);
  transition:transform .2s var(--jelly);
}
.copy-btn:active{animation:jellyTap .4s var(--spring)}

/* address form + map */
.map-wrap{
  height:210px;border-radius:26px;overflow:hidden;
  border:2px solid var(--line);box-shadow:var(--puff);
  margin-bottom:12px;position:relative;z-index:0;
  background:var(--surface2);
}
#addrMap{height:100%;width:100%}
.map-hint{font-size:11.5px;font-weight:600;color:var(--ink3);text-align:center;margin:-4px 0 14px}
.form-quick{display:flex;gap:10px;margin-bottom:16px}
.form-quick .use-loc-btn{margin-bottom:0;flex:1}
.geo-go{
  height:54px;padding:0 18px;border-radius:999px;flex:0 0 auto;
  background:var(--candy);color:#fff;font-weight:900;font-size:13.5px;
  box-shadow:var(--glow);
  transition:transform .2s var(--jelly);
}
.geo-go:active{animation:jellyTap .4s var(--spring)}
/* one single clean rounded input: magnifier inside on the left + Search button */
.geo-row{display:flex;gap:8px;align-items:center;width:100%}
.geo-row .search-box{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;
  height:50px;padding:0 15px;margin:0;
  background:var(--surface);border:2px solid var(--line);border-radius:999px;box-shadow:none;
}
.geo-row .search-box:focus-within{transform:none;border-color:var(--pink);box-shadow:0 0 0 4px rgba(47,107,255,.1)}
.geo-row .search-box .mag{flex:0 0 auto;font-size:15px}
.geo-row .search-box input{flex:1 1 auto;min-width:0;border:none;outline:none;background:transparent;font-size:14px;font-weight:600;color:var(--ink)}
.geo-row .geo-go{height:50px}
.aform{padding:0 16px}
.aform .fld{margin-bottom:14px}
.aform label{display:block;font-size:12px;font-weight:900;color:var(--ink2);margin-bottom:7px;letter-spacing:.01em}
.aform input{
  width:100%;height:50px;border-radius:20px;
  border:2px solid var(--line);background:var(--surface);
  padding:0 16px;font-size:14.5px;font-weight:600;color:var(--ink);outline:none;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.aform input:focus{border-color:var(--pink);box-shadow:0 0 0 5px rgba(47,107,255,.1)}
.aform input.err{border-color:var(--berry)}
.frow{display:flex;gap:10px}
.frow .fld{flex:1}
.type-chips{display:flex;gap:10px}
.type-chip{
  padding:11px 21px;border-radius:999px;
  border:2px solid var(--line);background:var(--surface2);
  font-weight:900;font-size:13px;color:var(--ink2);
  transition:all .3s var(--spring);
}
.type-chip.on{border-color:transparent;background:var(--candy);color:#fff;transform:scale(1.07) rotate(-2deg);box-shadow:var(--glow)}
.geo-box{position:relative;margin-bottom:14px}
.geo-results{
  position:absolute;left:0;right:0;top:100%;z-index:10;
  background:var(--surface);border:2px solid var(--line);
  border-radius:22px;box-shadow:var(--puff-lg);
  max-height:230px;overflow-y:auto;margin-top:6px;
}
.geo-item{
  width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;
  padding:12px 15px;border-bottom:2px dashed var(--line);font-size:13px;font-weight:600;color:var(--ink);
}
.geo-item:last-child{border-bottom:none}
.geo-item:active{background:var(--surface2)}
.geo-item .gi{flex:0 0 auto}
.geo-item .gs{display:block;font-size:11.5px;color:var(--ink3)}
.use-loc-btn{
  width:100%;height:48px;border-radius:999px;
  border:2px solid var(--sky);color:var(--sky);
  font-weight:900;font-size:13px;background:var(--sky-bg);
  margin-bottom:14px;
  transition:transform .2s var(--jelly);
}
.use-loc-btn:active{animation:jellyTap .4s var(--spring)}
.coord-pill{display:inline-flex;align-items:center;gap:6px;background:var(--mint-bg);color:var(--mint);border-radius:999px;padding:7px 15px;font-size:11.5px;font-weight:900;margin-bottom:12px}
.save-addr-btn{
  width:100%;height:56px;border-radius:999px;
  background:var(--candy);color:#fff;font-weight:900;font-size:15.5px;
  box-shadow:var(--glow);
  margin:6px 0 28px;
  transition:transform .2s var(--jelly);
}
.save-addr-btn:active{animation:jellyTap .4s var(--spring)}
.save-addr-btn[disabled]{opacity:.6}

/* ─── infinite scroll / misc ─── */
.sentinel-row{display:flex;justify-content:center;padding:18px 0 8px}
.sentinel-row .spinner{border-color:var(--line);border-top-color:var(--pink)}
.end-note{text-align:center;font-size:12px;font-weight:700;color:var(--ink3);padding:16px 0 4px}
.mini-spin{display:inline-block;width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--pink);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}

/* ─── toast ─── */
.toast-wrap{
  position:fixed;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom));
  z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;
}
.toast{
  background:var(--ink);color:var(--bg);
  border-radius:999px;padding:12px 23px;
  font-size:13.5px;font-weight:800;
  box-shadow:var(--puff-lg);
  animation:toastIn .4s var(--spring) both;
  max-width:86vw;text-align:center;
}
.toast.err{background:var(--berry);color:#fff}
.toast.ok{background:var(--mint);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .25s ease both}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.9)}}

.spinner{
  width:20px;height:20px;border-radius:50%;
  border:3px solid rgba(255,255,255,.4);border-top-color:#fff;
  animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;
}
.center-load{display:flex;justify-content:center;padding:30px}
/* Refer tab */
.sess-box{border-radius:20px;padding:13px 16px;margin-bottom:12px;border:2px solid var(--mint);background:var(--mint-bg)}
.sess-box .sb-top{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:900;color:var(--ink)}
.sess-box .sb-left{margin-left:auto;font-size:12px;font-weight:900;opacity:.85}
.sess-box .sb-sub{font-size:12px;font-weight:700;color:var(--ink2);margin-top:3px}
.sess-box .sb-hint{font-size:12px;font-weight:800;margin-top:6px}
.sess-box.warn{border-color:var(--sun);background:var(--sun-bg)}
.sess-box.warn .sb-hint{color:var(--sun)}
.sess-box.dead{border-color:var(--berry);background:var(--berry-bg)}
.sess-box.dead .sb-hint{color:var(--berry)}
.fod-card{
  background:linear-gradient(135deg,var(--sun,#ffb020),var(--pink));
  color:#fff;border-radius:22px;padding:15px 18px;margin-bottom:14px;box-shadow:var(--puff)
}
.fod-card .fod-l{font-size:13px;font-weight:800;opacity:.95}
.fod-card .fod-v{font-size:26px;font-weight:900;line-height:1.15;margin-top:3px;min-height:30px}
.fod-card .fod-sub{font-size:12px;font-weight:700;opacity:.92;margin-top:2px}
.fod-card .fod-btn{
  margin-top:11px;border:none;border-radius:999px;padding:7px 15px;cursor:pointer;
  background:rgba(255,255,255,.22);color:#fff;font-size:12px;font-weight:900;
}
.fod-card .fod-btn:active{transform:scale(.94)}
.fod-card.empty{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.fod-card.empty .fod-l{color:var(--ink)}
.fod-card.empty .fod-sub{color:var(--ink3)}
.fod-card.empty .fod-btn{background:var(--chip);color:var(--ink2)}
.ship-line{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:8px 0 2px;
  background:var(--chip);border-radius:14px;padding:7px 10px}
.ship-line .ship-c{font-size:12px;font-weight:900;color:var(--ink2)}
.ship-line .ship-awb{font-size:11.5px;font-weight:800;color:var(--ink);letter-spacing:.02em;
  background:var(--surface);border:1.5px solid var(--line);border-radius:999px;
  padding:4px 10px;cursor:pointer}
.ship-line .ship-awb span{opacity:.55;font-size:10.5px}
.ship-line .ship-awb:active{transform:scale(.94)}
.ship-line .ship-track{margin-left:auto;font-size:11.5px;font-weight:900;color:#fff;
  background:var(--candy);border:none;border-radius:999px;padding:5px 12px;cursor:pointer}
.ship-line .ship-track:active{transform:scale(.94)}
.cp-off{font-size:11.5px;font-weight:800;color:var(--mint);margin-top:2px}
.ref-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.ref-head .page-title{margin-bottom:0}
.ref-refresh{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);
  background:var(--surface);box-shadow:var(--puff);font-size:18px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.ref-refresh:active{transform:scale(.9)}
.ref-refresh:disabled{opacity:.7;cursor:default}
.ref-refresh.spin{animation:refspin 1s linear infinite}
@keyframes refspin{to{transform:rotate(360deg)}}
.ref-earn{background:linear-gradient(135deg,var(--pink),var(--sky));border-radius:22px;padding:16px 18px;margin-bottom:14px;color:#fff;box-shadow:var(--puff)}
.ref-earn .re-main{display:flex;align-items:center;justify-content:space-between}
.ref-earn .re-lbl{font-size:14px;font-weight:800;opacity:.95}
.ref-earn .re-val{font-size:26px;font-weight:900}
.ref-earn .re-sub{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12px;font-weight:700;opacity:.92}
.ref-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.ref-stat{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center;box-shadow:var(--puff)}
.ref-stat .rs-n{font-size:26px;font-weight:900;line-height:1;color:var(--ink)}
.ref-stat .rs-l{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:6px}
.ref-stat.ok{border-color:var(--mint);background:var(--mint-bg)}
.ref-stat.ok .rs-n{color:var(--mint)}
.ref-stat.wait{border-color:var(--sun);background:var(--sun-bg)}
.ref-stat.wait .rs-n{color:var(--sun)}
.ref-stat.bad{border-color:var(--berry);background:var(--berry-bg)}
.ref-stat.bad .rs-n{color:var(--berry)}
.ref-linkbox{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--puff);margin-bottom:14px}
.ref-linkbox.empty{border-style:dashed}
.rlb-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:10px}
.rlb-link{font-size:12.5px;font-weight:600;color:var(--ink2);word-break:break-all;background:var(--chip);border-radius:14px;padding:11px 13px;margin-bottom:12px;line-height:1.5}
.rlb-hint{font-size:12.5px;font-weight:600;color:var(--ink3);line-height:1.55}
.rlb-copy{width:100%;border:none;border-radius:999px;padding:13px;font-size:14px;font-weight:900;color:#fff;background:var(--pink);box-shadow:var(--puff);cursor:pointer;margin-top:4px}
.rlb-copy:active{transform:scale(.97)}
.ref-note{font-size:12px;font-weight:600;color:var(--ink3);text-align:center;line-height:1.55;padding:4px 10px}
.center-load .spinner{border-color:var(--line);border-top-color:var(--pink);width:30px;height:30px}

/* ─── search sub-tabs (segmented) ─── */
.seg-tabs{
  display:flex;gap:4px;background:var(--surface2);
  border:2px solid var(--line);border-radius:999px;
  padding:4px;margin-bottom:14px;
}
.seg-tabs button{
  flex:1;height:38px;border-radius:999px;
  font-size:13px;font-weight:900;color:var(--ink2);
  transition:all .3s var(--spring);
}
.seg-tabs button.on{background:var(--candy);color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.3)}
.link-row{display:flex;gap:9px;margin-bottom:16px}
.link-row .search-box{flex:1;min-width:0}

/* ─── error / retry state ─── */
.err-state{text-align:center;padding:44px 30px;animation:floatIn .5s var(--swoosh) both}
.err-state .art{
  width:96px;height:96px;margin:0 auto 18px;border-radius:34px;
  background:var(--berry-bg);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:44px;
}
.err-state h3{font-size:18px;font-weight:900;margin-bottom:6px}
.err-state p{color:var(--ink2);font-size:13px;font-weight:600;max-width:260px;margin:0 auto}
.retry-btn{
  margin-top:18px;display:inline-block;padding:12px 30px;border-radius:999px;
  background:var(--candy);color:#fff;font-weight:900;font-size:14px;
  box-shadow:var(--glow);transition:transform .2s var(--jelly);
}
.retry-btn:active{animation:jellyTap .4s var(--spring)}

/* ─── order tracking screen ─── */
.od-help{
  margin-left:auto;flex:0 0 auto;
  font-size:13px;font-weight:900;color:var(--pink);
  background:var(--chip);border-radius:999px;padding:8px 16px;
  transition:transform .2s var(--jelly);
}
.od-help:active{animation:jellyTap .4s var(--spring)}
.od-prod{
  background:var(--surface);border:2px solid var(--line);
  border-radius:26px;box-shadow:var(--puff);
  padding:12px;margin:14px 16px 0;
  display:flex;gap:12px;align-items:center;
  animation:floatIn .45s var(--swoosh) both;
}
.od-prod img{width:70px;height:82px;border-radius:16px;object-fit:cover;background:var(--surface2);flex:0 0 auto}
.od-prod .pb{min-width:0;flex:1}
.od-prod .onum{font-size:11px;font-weight:900;color:var(--ink3);letter-spacing:.02em;margin-bottom:2px}
.od-prod .pn{font-size:13px;font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.od-prod .sub{font-size:12px;font-weight:700;color:var(--ink2);margin-top:3px}
.od-prod .ret{font-size:11px;font-weight:600;color:var(--ink3);margin-top:2px}
.od-prod .chev{color:var(--ink3);font-size:15px;flex:0 0 auto}
.od-prod.tapp{cursor:pointer}
.od-prod.tapp:active{transform:scale(.98);background:var(--surface2)}
.od-status-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.od-status-head .sic{
  width:46px;height:46px;border-radius:18px;flex:0 0 auto;
  background:var(--candy-soft);border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  transform:rotate(-4deg);
}
.od-status-head .sic img{width:26px;height:26px;object-fit:contain}
.od-status-head .st1{font-size:16px;font-weight:900;letter-spacing:-.02em}
.od-status-head .st2{font-size:12.5px;font-weight:700;color:var(--ink2)}
/* horizontal stepper */
.hstep-scroll{overflow-x:auto;scrollbar-width:none;margin:0 -6px}
.hstep-scroll::-webkit-scrollbar{display:none}
.hstep{display:flex;min-width:100%;padding:40px 6px 4px;position:relative}
.hs{flex:1;min-width:70px;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center}
.hs::before{
  content:"";position:absolute;top:12px;right:50%;width:100%;height:4px;
  background:var(--line);border-radius:4px;z-index:0;
}
.hs:first-child::before{display:none}
.hs.done::before{background:var(--candy)}
.hs .dot{
  width:28px;height:28px;border-radius:999px;flex:0 0 auto;
  background:var(--surface);border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;
